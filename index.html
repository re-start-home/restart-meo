    // 画面暗転を100%防ぐエラー保護コンポーネント
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorText: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorText: String(error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-navy-950 text-white flex flex-col items-center justify-center p-6 text-center">
              <div className="max-w-md bg-navy-900 border border-rose-500/50 rounded-2xl p-6 space-y-4">
                <div className="text-3xl">🛠️</div>
                <h2 className="text-base font-bold text-rose-300">表示データの切り替え中に一時エラーが発生しました</h2>
                <p className="text-xs text-slate-300 break-all bg-navy-950 p-3 rounded-lg border border-slate-800">
                  {this.state.errorText}
                </p>
                <button
                  onClick={() => {
                    window.location.reload();
                  }}
                  className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs"
                >
                  画面を再読み込みする
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

        const latestRank = kwRanks[0];
        const prevRankObj = kwRanks[1];
        return {
          id: kw.id,
          word: kw.keyword,
          date: latestRank ? latestRank.measured_date : new Date(kw.created_at).toLocaleDateString("ja-JP"),
          avgRank: latestRank && latestRank.rank_position !== null ? Number(latestRank.rank_position) : "-",
          prevRank: prevRankObj && prevRankObj.rank_position !== null ? Number(prevRankObj.rank_position) : "-",
          pins: [
            { id: 1, area: "店舗中心エリア", top: "48%", left: "48%", rank: latestRank && latestRank.rank_position ? Math.round(Number(latestRank.rank_position)) : 3 },
            { id: 2, area: "北エリア(500m)", top: "28%", left: "48%", rank: latestRank && latestRank.rank_position ? Math.round(Number(latestRank.rank_position)) + 1 : 4 },

            { id: 4, area: "南エリア(500m)", top: "68%", left: "48%", rank: latestRank && latestRank.rank_position ? Math.round(Number(latestRank.rank_position)) + 2 : 5 },
            { id: 5, area: "西エリア(500m)", top: "48%", left: "28%", rank: latestRank && latestRank.rank_position ? Math.round(Number(latestRank.rank_position)) + 1 : 4 }
          ]

        {
          id: "kw-empty",
          word: "キーワード未登録（左メニューから追加可能）",
          date: "-",
          avgRank: "-",
          prevRank: "-",
          pins: []
        }
      ];

      // 口コミ最新スナップショット
      const storeRevs = reviewsList.filter(r => r.store_id === dbStore.id);
      const latestRev = storeRevs[0];
      const totalRev = latestRev ? Number(latestRev.total_reviews) : 0;
      const repliedRev = latestRev ? Number(latestRev.replied_count) : 0;
      const unrepliedRev = latestRev ? Number(latestRev.unreplied_count) : 0;
      const replyRate = totalRev > 0 ? Math.min(100, Math.round((repliedRev / totalRev) * 100)) : 0;

      // 投稿数
      const storePosts = postsList.filter(p => p.store_id === dbStore.id);

      // パフォーマンス実績
      const storePerfs = perfList.filter(p => p.store_id === dbStore.id);
      const formattedPerf = storePerfs.map(p => ({
        month: p.target_month,
        search: Number(p.search_views) || 0,
        profile: Number(p.profile_views) || 0,
        web: Number(p.website_clicks) || 0,
        call: Number(p.call_clicks) || 0,
        route: Number(p.direction_requests) || 0

      // 改善タスク
      const storeTasks = tasksList.filter(t => t.store_id === dbStore.id);

        id: t.id,
        title: t.title,
        priority: t.priority === "high" ? "高" : t.priority === "low" ? "低" : "中",

          if (data?.session) {
            setSession(data.session);
            loadAllData(data.session.user);
          }
        }).catch(err => console.error(err));

        const { data: listener } = supabase.auth.onAuthStateChange((_event, newSession) => {
          setSession(newSession);
          if (newSession?.user) {
            loadAllData(newSession.user);
          } else {
            setUserProfile(null);
          }
        });
        return () => {
          if (listener?.subscription) listener.subscription.unsubscribe();
        };
      }, [supabase]);

      const loadAllData = async (user) => {
        if (!supabase || !user) return;
        try {
          const { data: prof } = await supabase.from("profiles").select("*").eq("id", user.id).single();

            setUserProfile(prof);
            setRole(prof.role || "admin");

            const fallback = { id: user.id, email: user.email || "", full_name: "Re.Start 管理者", role: "admin" };

            setUserProfile(fallback);
            setRole("admin");

          await refreshTables();

          console.error(e);

          const [orgs, stores, kws, ranks, revs, posts, perfs, tasks, profs, assigns] = await Promise.all([
            supabase.from("organizations").select("*").order("created_at", { ascending: false }),
            supabase.from("stores").select("*").order("created_at", { ascending: false }),
            supabase.from("keywords").select("*").order("created_at", { ascending: false }),
            supabase.from("rank_measurements").select("*").order("measured_date", { ascending: false }),
            supabase.from("review_snapshots").select("*").order("snapshot_date", { ascending: false }),
            supabase.from("post_records").select("*").order("posted_at", { ascending: false }),
            supabase.from("performance_snapshots").select("*").order("created_at", { ascending: true }),
            supabase.from("improvement_tasks").select("*").order("created_at", { ascending: false }),
            supabase.from("profiles").select("*").order("created_at", { ascending: false }),
            supabase.from("store_assignments").select("*")
          ]);

          const orgList = orgs.data || [];
          const storeList = stores.data || [];
          const kwList = kws.data || [];

          setDbOrgs(orgList);
          setDbStores(storeList);
          setDbKeywords(kwList);
          setDbRanks(ranks.data || []);
          setDbReviews(revs.data || []);
          setDbPosts(posts.data || []);
          setDbPerf(perfs.data || []);
          setDbTasks(tasks.data || []);
          setDbProfiles(profs.data || []);
          setDbStoreAssigns(assigns.data || []);

          if (orgList.length > 0 && !newStoreOrgId) setNewStoreOrgId(orgList[0].id);
          if (storeList.length > 0) {
            if (!targetStoreForKw) setTargetStoreForKw(storeList[0].id);
            if (!targetStoreForManual) setTargetStoreForManual(storeList[0].id);
            if (!csvStoreId) setCsvStoreId(storeList[0].id);
          }
          if (kwList.length > 0 && !selectedKwIdForRank) {
            setSelectedKwIdForRank(kwList[0].id);
          }
        } catch (err) {
          console.error("DB読み込みエラー:", err);
        }
      };

      // --- 会社追加 ---
      const handleCreateOrg = async (e) => {
        e.preventDefault();
        if (!supabase || !newOrgName.trim()) return;
        const { data, error } = await supabase.from("organizations").insert({
          name: newOrgName.trim(),
          contact_email: newOrgEmail.trim() || null,
          phone: newOrgPhone.trim() || null,
          status: "active"
        }).select().single();

        if (error) {
          alert("会社登録エラー: " + error.message);
          return;
        }
        setNewOrgName("");
        setNewOrgEmail("");
        setNewOrgPhone("");
        await refreshTables();
        setNewStoreOrgId(data.id);
        notify(`✅ 会社「${data.name}」を登録しました！`);
      };

      // --- 店舗追加 ---
      const handleCreateStore = async (e) => {
        e.preventDefault();
        if (!supabase || !newStoreName.trim() || !newStoreOrgId) {
          alert("所属会社と店舗名を入力してください。");
          return;
        }
        const { data, error } = await supabase.from("stores").insert({
          organization_id: newStoreOrgId,
          name: newStoreName.trim(),
          prefecture: newStorePref.trim(),
          city: newStoreCity.trim(),
          address: newStoreAddr.trim(),
          phone: newStorePhone.trim() || null,
          profile_strength_score: Number(newStoreScore) || 85,
          map_connected: true,
          gbp_connected: true
        }).select().single();

        if (error) {
          alert("店舗登録エラー: " + error.message);
          return;
        }
        setNewStoreName("");
        setNewStoreAddr("");
        await refreshTables();
        setSelectedStoreId(data.id);
        notify(`🏪 店舗「${data.name}」を登録しました！`);
      };

      // --- フェーズ6：キーワード登録 ---
      const handleAddKeyword = async (e) => {
        e.preventDefault();
        if (!supabase || !targetStoreForKw || !newKeywordText.trim()) {
          alert("対象店舗とキーワードを入力してください。");
          return;
        }
        const { data, error } = await supabase.from("keywords").insert({
          store_id: targetStoreForKw,
          keyword: newKeywordText.trim(),
          created_by: session?.user?.id || null
        }).select().single();

        if (error) {
          alert("キーワード登録エラー: " + error.message);
          return;
        }
        setNewKeywordText("");
        await refreshTables();
        setSelectedKwIdForRank(data.id);
        notify(`🔑 キーワード「${data.keyword}」を追加しました！`);
      };

      // --- フェーズ6：検索順位の計測記録を追加 ---
      const handleAddRank = async (e) => {
        e.preventDefault();
        if (!supabase || !selectedKwIdForRank) {
          alert("先にキーワードを登録・選択してください。");
          return;
        }
        const kwObj = dbKeywords.find(k => k.id === selectedKwIdForRank);
        if (!kwObj) return;

        const { error } = await supabase.from("rank_measurements").insert({
          store_id: kwObj.store_id,
          keyword_id: kwObj.id,
          measured_date: newRankDate,
          rank_position: Number(newRankPos),
          source_type: "manual",
          recorded_by: session?.user?.id || null
        });

        if (error) {
          alert("順位記録エラー: " + error.message);
          return;
        }
        await refreshTables();
        notify(`📍 「${kwObj.keyword}」の順位（${newRankPos}位）を記録しました！`);
      };

      // --- フェーズ6＆7：口コミスナップショット手動登録 ---
      const handleSaveReviewSnapshot = async (e) => {
        e.preventDefault();
        if (!supabase || !targetStoreForManual) {
          alert("対象店舗を選択してください。");
          return;
        }
        const { error } = await supabase.from("review_snapshots").insert({
          store_id: targetStoreForManual,
          average_rating: Number(revAvg),
          total_reviews: Number(revTotal),
          new_reviews: Number(revNew),
          replied_count: Number(revReplied),
          unreplied_count: Number(revUnreplied),
          source_type: "manual",
          recorded_by: session?.user?.id || null
        });
        if (error) {
          alert("口コミ保存エラー: " + error.message);
          return;
        }
        await refreshTables();
        setSelectedStoreId(targetStoreForManual);
        notify("💬 口コミ件数・平均評価をデータベースに保存しました！");
      };

      // --- フェーズ6＆7：GBP投稿実績の登録 ---
      const handleSavePostRecord = async (e) => {
        e.preventDefault();
        if (!supabase || !targetStoreForManual || !postTitle.trim()) return;
        const { error } = await supabase.from("post_records").insert({
          store_id: targetStoreForManual,
          title: postTitle.trim(),
          content: postContent.trim() || null,
          post_type: "whats_new",
          status: "published",
          created_by: session?.user?.id || null
        });
        if (error) {
          alert("投稿記録エラー: " + error.message);
          return;
        }
        setPostTitle("");
        setPostContent("");
        await refreshTables();
        notify("📝 GBP投稿実績を記録しました！");
      };

      // --- フェーズ6＆7：GBPパフォーマンス数値の登録 ---
      const handleSavePerformance = async (e) => {
        e.preventDefault();
        if (!supabase || !targetStoreForManual) return;
        const { error } = await supabase.from("performance_snapshots").insert({
          store_id: targetStoreForManual,
          target_month: perfMonth.trim(),
          search_views: Number(perfSearch),
          profile_views: Number(perfProfile),
          website_clicks: Number(perfWeb),
          call_clicks: Number(perfCall),
          direction_requests: Number(perfRoute),
          source_type: "manual",
          recorded_by: session?.user?.id || null
        });
        if (error) {
          alert("実績保存エラー: " + error.message);
          return;
        }
        await refreshTables();
        setSelectedStoreId(targetStoreForManual);
        notify(`📈 ${perfMonth}のGBPパフォーマンス数値を保存しました！`);
      };

      // --- フェーズ7：CSVインポート（検証・重複チェック・エラー行表示付き） ---
      const handleCsvImport = async (e) => {
        e.preventDefault();
        if (!supabase || !csvStoreId || !csvText.trim()) {
          alert("対象店舗とCSVデータを入力してください。");
          return;
        }
        const lines = csvText.trim().split(/\r?\n/);
        let inserted = 0;
        let skipped = 0;
        const errors = [];
        const existingSet = new Set(
          dbKeywords.filter(k => k.store_id === csvStoreId).map(k => k.keyword.toLowerCase())
        );

        for (let i = 0; i < lines.length; i++) {
          const raw = lines[i].trim();
          if (!raw) continue;
          const cols = raw.split(",").map(c => c.trim());
          const word = cols[0];
          const rankVal = cols[1] ? Number(cols[1]) : null;

          // ヘッダー行はスキップ
          if (i === 0 && (word.toLowerCase() === "keyword" || word === "キーワード")) {
            continue;
          }
          if (word.length < 2) {
            errors.push(`${i + 1}行目: キーワードが短すぎます (${raw})`);
            continue;
          }
          if (existingSet.has(word.toLowerCase())) {
            skipped++;
            continue;
          }

          const { data: kwData, error: kwErr } = await supabase.from("keywords").insert({
            store_id: csvStoreId,
            keyword: word,
            created_by: session?.user?.id || null
          }).select().single();

          if (kwErr) {
            errors.push(`${i + 1}行目: DB保存エラー (${kwErr.message})`);
            continue;
          }

          existingSet.add(word.toLowerCase());
          inserted++;

          if (rankVal !== null && !isNaN(rankVal) && rankVal > 0) {
            await supabase.from("rank_measurements").insert({
              store_id: csvStoreId,
              keyword_id: kwData.id,
              rank_position: rankVal,
              source_type: "csv",
              recorded_by: session?.user?.id || null
            });
          }
        }

        setCsvReport({ inserted, skipped, errors });
        setCsvText("");
        await refreshTables();
        setSelectedStoreId(csvStoreId);
        notify(`📥 CSVインポート完了: 新規登録 ${inserted}件 / 重複スキップ ${skipped}件`);
      };

      // --- ユーザー権限変更＆店舗割り当て ---
      const handleAssignStore = async (e) => {
        e.preventDefault();
        if (!supabase || !assignUserId || !assignStoreId) return;
        const st = dbStores.find(s => s.id === assignStoreId);
        if (st) {
          await supabase.from("organization_members").upsert({
            organization_id: st.organization_id,
            user_id: assignUserId,
            member_role: assignRole
          }, { onConflict: "organization_id,user_id" });
        }
        await supabase.from("store_assignments").upsert({
          store_id: assignStoreId,
          user_id: assignUserId,
          assignment_role: assignRole
        }, { onConflict: "store_id,user_id" });
        await refreshTables();
        notify("✅ 店舗のアクセス権限を割り当てました！");
      };

      // 全店舗リストの統合
      const allViewStores = useMemo(() => {
        const orgMap = {};
        dbOrgs.forEach(o => { orgMap[o.id] = o; });
        const mappedReal = dbStores.map(s =>
          mapDbStoreToView(s, orgMap, dbKeywords, dbRanks, dbReviews, dbPosts, dbPerf, dbTasks)
        );
        return [...mappedReal, ...demoStoreList];
      }, [dbStores, dbOrgs, dbKeywords, dbRanks, dbReviews, dbPosts, dbPerf, dbTasks, demoStoreList]);

      const currentStore = useMemo(() => {
        return allViewStores.find(s => s.id === selectedStoreId) || allViewStores[0] || DEMO_STORES[0];
      }, [allViewStores, selectedStoreId]);

      const currentKeyword = (currentStore.keywords && currentStore.keywords[selectedKwIndex]) || currentStore.keywords[0] || {
        word: "未設定", date: "-", avgRank: "-", prevRank: "-", pins: []
      };

      const visibleMenus = useMemo(() => {
        return MENU_ITEMS.filter(item => item.roles.includes(role));
      }, [role]);

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem("restart_sb_url", sbUrl.trim());
        localStorage.setItem("restart_sb_key", sbKey.trim());
        setShowConfigModal(false);
        setAuthMessage({ type: "success", text: "Supabase接続設定を保存しました！" });
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthMessage({ type: "", text: "" });
        if (!supabase) {
          setAuthMessage({ type: "error", text: "先にSupabase接続設定を保存してください。" });
          return;
        }
        if (authMode === "login") {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            setAuthMessage({ type: "error", text: "ログイン失敗: " + error.message });
          } else if (data?.session) {
            setSession(data.session);
          }
        } else {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName || "Re.Start 管理者", role: signupRole } }
          });
          if (error) {
            setAuthMessage({ type: "error", text: "登録エラー: " + error.message });
          } else if (data?.session) {
            setSession(data.session);
          } else {
            setAuthMessage({ type: "success", text: "登録完了！ログインしてください。" });
            setAuthMode("login");
          }
        }
      };

      const handleLogout = async () => {
        if (supabase) await supabase.auth.signOut();
        setSession(null);
        setUserProfile(null);
        setDemoBypass(false);
      };

      const toggleTask = (task) => {
        if (role === "client") {
          alert("顧客アカウントは閲覧専用です。");
          return;
        }
        setDemoStoreList(prev => prev.map(st => {
          if (st.id !== currentStore.id) return st;
          return {
            ...st,
            tasks: st.tasks.map(t => t.id === task.id ? { ...t, done: !t.done } : t)
          };
        }));
      };

      const getPinColor = (rank) => {
        if (rank <= 3) return "bg-emerald-500 border-emerald-200 text-slate-950 shadow-emerald-500/50";
        if (rank <= 10) return "bg-cyan-500 border-cyan-200 text-slate-950 shadow-cyan-500/50";
        return "bg-amber-500 border-amber-200 text-slate-950 shadow-amber-500/50";
      };

      const metricLabels = {
        search: { name: "検索表示数", color: "bg-cyan-400" },
        profile: { name: "プロフィール閲覧数", color: "bg-blue-500" },
        web: { name: "Webサイトクリック数", color: "bg-emerald-400" },
        call: { name: "電話クリック数", color: "bg-amber-400" },
        route: { name: "ルート検索数", color: "bg-purple-400" },
      };

      const maxMetricValue = useMemo(() => {
        if (!currentStore.performance || !currentStore.performance.length) return 100;
        const vals = currentStore.performance.map(p => Number(p[metricKey]) || 0);
        return Math.max(10, ...vals) * 1.1;
      }, [currentStore, metricKey]);

      // ==========================================
      // 未ログイン時のログイン画面
      // ==========================================
      if (!session && !demoBypass) {
        return (
          <div className="min-h-screen bg-navy-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-navy-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500 via-amber-500 to-blue-600 flex items-center justify-center font-black text-xl text-white shadow-lg">
                    R
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-white tracking-wide">Re.Start MEO</h1>
                    <p className="text-xs text-slate-400">MEO対策・GBP統合管理クラウド</p>
                  </div>
                </div>
                <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[11px] font-bold px-2.5 py-1 rounded-full">
                  Ver 7.5 復旧完了版
                </span>
              </div>

              <div className="p-3 rounded-xl bg-navy-800 border border-slate-700/80 flex items-center justify-between text-xs">
                <div className="flex items-center gap-2">
                  <span className={`w-2.5 h-2.5 rounded-full ${supabase ? "bg-emerald-400" : "bg-amber-400"}`}></span>
                  <span className="text-slate-200 font-medium">
                    {supabase ? "Supabase DB 接続準備完了" : "Supabase URL/Key が未設定です"}
                  </span>
                </div>
                <button onClick={() => setShowConfigModal(!showConfigModal)} className="text-cyan-400 underline font-semibold">
                  {showConfigModal ? "閉じる" : "接続設定"}
                </button>
              </div>

              {(!supabase || showConfigModal) && (
                <form onSubmit={handleSaveConfig} className="p-4 rounded-xl bg-navy-950 border border-cyan-500/40 space-y-3 text-xs">
                  <div className="font-bold text-cyan-300">🔑 Supabase接続キー設定</div>
                  <div>
                    <label className="block text-slate-400 mb-1">Project URL</label>
                    <input type="url" required value={sbUrl} onChange={e => setSbUrl(e.target.value)} className="w-full bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">API Key (anon public)</label>
                    <input type="text" required value={sbKey} onChange={e => setSbKey(e.target.value)} className="w-full bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                  </div>
                  <button type="submit" className="w-full bg-cyan-600 text-white font-bold py-2 rounded-lg">接続キーを保存する</button>
                </form>
              )}

              <div className="grid grid-cols-2 gap-2 bg-navy-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                <button type="button" onClick={() => setAuthMode("login")} className={`py-2 rounded-lg ${authMode === "login" ? "bg-blue-600 text-white" : "text-slate-400"}`}>ログイン</button>
                <button type="button" onClick={() => setAuthMode("signup")} className={`py-2 rounded-lg ${authMode === "signup" ? "bg-emerald-600 text-white" : "text-slate-400"}`}>新規アカウント作成</button>
              </div>

              {authMessage.text && (
                <div className="p-3 rounded-xl text-xs border bg-rose-500/15 border-rose-500/40 text-rose-300">
                  {authMessage.text}
                </div>
              )}

              <form onSubmit={handleAuthSubmit} className="space-y-3.5 text-xs sm:text-sm">
                {authMode === "signup" && (
                  <div>
                    <label className="block text-slate-300 mb-1 text-xs">お名前（表示名）</label>
                    <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white" />
                  </div>
                )}
                <div>
                  <label className="block text-slate-300 mb-1 text-xs">メールアドレス</label>
                  <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white" />
                </div>
                <div>
                  <label className="block text-slate-300 mb-1 text-xs">パスワード（6文字以上）</label>
                  <input type="password" required minLength={6} value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white" />
                </div>
                <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold py-3 rounded-xl shadow-lg">
                  {authMode === "login" ? "Re.Start MEO にログイン" : "アカウントを登録して開始"}
                </button>
              </form>

              <div className="pt-2 border-t border-slate-800 text-center">
                <button type="button" onClick={() => setDemoBypass(true)} className="text-xs text-slate-400 underline">
                  ログインせずにデモ画面を開く ➔
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // ログイン後のメインシステム画面（フェーズ1〜7完全統合）
      // ==========================================
      return (
        <div className="min-h-screen flex flex-col bg-navy-950 text-slate-100">
          {/* 最上部ステータスバー */}
          <div className="bg-gradient-to-r from-emerald-500/20 via-blue-500/20 to-amber-500/20 border-b border-emerald-500/40 px-3 py-1.5 text-xs flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <span className="bg-emerald-400 text-slate-950 font-bold px-2 py-0.5 rounded text-[11px]">
                Ver 7.5 正常稼働中
              </span>
              <span className="text-slate-200 font-medium">
                {currentStore.isDemo ? "現在「デモデータ店舗」を表示中" : `本番DB店舗「${currentStore.storeName}」を表示中`}
              </span>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="text-slate-400">権限切替:</span>
              <button onClick={() => setRole("admin")} className={`px-2 py-0.5 rounded font-semibold ${role === "admin" ? "bg-blue-600 text-white" : "bg-navy-800 text-slate-400"}`}>管理者</button>
              <button onClick={() => setRole("staff")} className={`px-2 py-0.5 rounded font-semibold ${role === "staff" ? "bg-cyan-600 text-white" : "bg-navy-800 text-slate-400"}`}>従業員</button>
              <button onClick={() => setRole("client")} className={`px-2 py-0.5 rounded font-semibold ${role === "client" ? "bg-emerald-600 text-white" : "bg-navy-800 text-slate-400"}`}>顧客</button>
              <button onClick={handleLogout} className="ml-2 px-2 py-0.5 rounded bg-rose-500/20 border border-rose-500/40 text-rose-300 font-semibold">ログアウト</button>
            </div>
          </div>

          {actionNotice && (
            <div className="bg-emerald-600 text-white text-xs sm:text-sm font-bold px-4 py-2.5 text-center shadow-lg">
              {actionNotice}
            </div>
          )}

          {/* A. ヘッダー */}
          <header className="bg-navy-900/95 border-b border-slate-800 px-4 py-3 sticky top-0 z-30 backdrop-blur">
            <div className="flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="lg:hidden p-2 rounded-lg bg-navy-800 border border-slate-700 text-slate-200 font-bold"
                >
                  ☰ メニュー
                </button>
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500 via-amber-500 to-blue-600 flex items-center justify-center font-black text-white shadow-lg">
                    R
                  </div>
                  <div>
                    <span className="font-bold text-base tracking-wide text-white">Re.Start MEO</span>
                    <p className="text-[11px] text-slate-400 hidden sm:block">{currentStore.companyName}</p>
                  </div>
                </div>

                    {dbStores.map(st => (
                      <div key={st.id} className="p-3 rounded-xl bg-navy-800 border border-slate-700 flex justify-between items-center">
                        <span className="font-bold text-white text-sm">🏪 {st.name}</span>
                        <button onClick={() => { setSelectedStoreId(st.id); setActiveMenu("dashboard"); }} className="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg">
                          ダッシュボードで表示 ➔
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 👥 ユーザー・権限管理 */}
              {activeMenu === "users" && (
                <div className="space-y-5">
                  <form onSubmit={handleAssignStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">👥 ユーザーへの店舗割り当て</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <select required value={assignUserId} onChange={e => setAssignUserId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- ユーザーを選択 --</option>
                        {dbProfiles.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.email})</option>)}
                      </select>
                      <select required value={assignStoreId} onChange={e => setAssignStoreId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                      <select value={assignRole} onChange={e => setAssignRole(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="client">顧客として閲覧許可</option>
                        <option value="staff">担当スタッフとして編集許可</option>
                      </select>
                    </div>
                    <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">割り当てを保存</button>
                  </form>
                </div>
              )}

              {/* 📊 メインダッシュボード */}
              {activeMenu === "dashboard" && (
                <div className="grid grid-cols-1 xl:grid-cols-12 gap-5">
                  <div className="xl:col-span-8 space-y-5">
                    {/* C. 検索順位マップ */}
                    <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-white">エリア別 検索順位マップ</h2>
                          <p className="text-xs text-slate-400 mt-0.5">店舗所在地: {currentStore.address}</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                          <select
                            value={selectedKwIndex}
                            onChange={(e) => setSelectedKwIndex(Number(e.target.value))}
                            className="bg-navy-800 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 font-medium"
                          >
                            {currentStore.keywords.map((kw, i) => (
                              <option key={kw.id} value={i}>🔑 {kw.word}</option>
                            ))}
                          </select>
                          <div className="bg-navy-800 border border-slate-700 text-xs text-slate-300 rounded-lg px-3 py-2">
                            📅 測定日: {currentKeyword.date}
                          </div>
                        </div>
                      </div>

                      {currentKeyword.pins && currentKeyword.pins.length > 0 ? (
                        <div className="relative w-full h-72 sm:h-80 rounded-xl overflow-hidden border border-slate-700 bg-[#162238]">
                          <div
                            className="absolute inset-0 opacity-25"
                            style={{
                              backgroundImage:
                                "linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px)",
                              backgroundSize: "36px 36px"
                            }}
                          />
                          <div className="absolute top-3 left-3 bg-navy-950/90 border border-slate-700 rounded-xl px-3 py-2 shadow-lg">
                            <div className="text-[11px] text-slate-400">選択キーワード</div>
                            <div className="text-xs sm:text-sm font-bold text-white">{currentKeyword.word}</div>
                          </div>
                          <div className="absolute top-3 right-3 bg-navy-950/90 border border-slate-700 rounded-xl px-3 py-2 text-right shadow-lg">
                            <div className="text-[11px] text-slate-400">最新順位</div>
                            <div className="text-sm sm:text-base font-black text-emerald-400">{currentKeyword.avgRank}位</div>
                          </div>
                          {currentKeyword.pins.map(pin => (
                            <div
                              key={pin.id}
                              style={{ top: pin.top, left: pin.left }}
                              className="absolute -translate-x-1/2 -translate-y-1/2"
                            >
                              <div className={`w-8 h-8 sm:w-9 sm:h-9 rounded-full border-2 flex items-center justify-center font-black text-xs sm:text-sm shadow-lg ${getPinColor(pin.rank)}`}>
                                {pin.rank}
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="w-full h-60 rounded-xl border-2 border-dashed border-slate-700 bg-navy-950/60 flex flex-col items-center justify-center p-6 text-center">
                          <h3 className="text-sm font-bold text-amber-300">キーワードまたは順位データが未登録です</h3>
                          <button onClick={() => setActiveMenu("keywords")} className="mt-3 bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-xl">
                            ＋ キーワード・順位を登録する
                          </button>
                        </div>
                      )}
                    </section>

                    {/* D. プロフィール充実度 ＆ 改善タスク */}
                    <section className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                        <h3 className="text-sm sm:text-base font-bold text-white mb-1">プロフィール充実度</h3>
                        <p className="text-[11px] text-slate-400 mb-4">※Re.Start独自のMEO評価基準による算出値</p>
                        <div className="space-y-4">
                          {currentStore.profileScores.map(item => (
                            <div key={item.id}>
                              <div className="flex items-center justify-between text-xs mb-1">
                                <span className="font-medium text-slate-200">{item.label}</span>
                                <span className="font-bold text-white">{item.score}%</span>
                              </div>
                              <div className="w-full h-2.5 bg-navy-800 rounded-full overflow-hidden">
                                <div className={`h-full rounded-full ${item.color}`} style={{ width: `${item.score}%` }} />
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                        <h3 className="text-sm sm:text-base font-bold text-white mb-1">GBP最適化・改善タスク</h3>
                        <p className="text-[11px] text-slate-400 mb-3">タップで完了状態を切り替え</p>
                        <div className="space-y-2.5">
                          {currentStore.tasks.map(task => (
                            <div
                              key={task.id}
                              onClick={() => toggleTask(task)}
                              className={`p-3 rounded-xl border text-xs flex items-start gap-2.5 cursor-pointer ${
                                task.done ? "bg-navy-950/50 border-slate-800 text-slate-500 line-through" : "bg-navy-800/90 border-slate-700 text-slate-100"
                              }`}
                            >
                              <input type="checkbox" checked={task.done} onChange={() => {}} className="mt-0.5 h-4 w-4 accent-blue-500" />
                              <div className="flex-1 font-medium">{task.title}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </section>
                  </div>

                  {/* 右4カラム（E・F・G） */}
                  <div className="xl:col-span-4 space-y-5">
                    <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                      <div className="flex items-center justify-between mb-3">
                        <h3 className="text-sm sm:text-base font-bold text-white">口コミ管理サマリー</h3>
                        <button onClick={() => setActiveMenu("reviews")} className="text-[11px] text-cyan-400 underline">数値を編集</button>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="bg-navy-800/90 border border-slate-800 rounded-xl p-3">
                          <div className="text-amber-400 text-sm">★★★★★</div>
                          <div className="text-xl font-black text-white mt-1">{currentStore.reviews.avg}</div>
                          <div className="text-[11px] text-slate-400">総数: {currentStore.reviews.total}件</div>
                        </div>
                        <div className="bg-navy-800/90 border border-slate-800 rounded-xl p-3">
                          <div className="text-xs text-slate-300">返信済</div>
                          <div className="text-xl font-black text-cyan-400 mt-1">{currentStore.reviews.replied}件</div>
                          <div className="text-[11px] text-rose-400 font-semibold">未返信: {currentStore.reviews.unreplied}件</div>
                        </div>
                      </div>
                    </section>

                    <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                      <div className="flex items-center justify-between mb-2">
                        <h3 className="text-sm sm:text-base font-bold text-white">GBPパフォーマンス推移</h3>
                        <button onClick={() => setActiveMenu("reviews")} className="text-[11px] text-cyan-400 underline">実績を追加</button>
                      </div>
                      <div className="flex flex-wrap gap-1.5 mb-4">
                        {Object.entries(metricLabels).map(([k, info]) => (
                          <button
                            key={k}
                            onClick={() => setMetricKey(k)}
                            className={`text-[11px] px-2.5 py-1 rounded-lg font-medium ${
                              metricKey === k ? "bg-blue-600 text-white" : "bg-navy-800 text-slate-400"
                            }`}
                          >
                            {info.name}
                          </button>
                        ))}
                      </div>
                      {currentStore.performance && currentStore.performance.length > 0 ? (
                        <div>
                          <div className="h-36 flex items-end justify-between gap-2 pt-4 px-2 border-b border-slate-800">
                            {currentStore.performance.map((pt, i) => {
                              const val = Number(pt[metricKey]) || 0;
                              const heightPct = Math.max(12, Math.round((val / maxMetricValue) * 100));
                              return (
                                <div key={i} className="flex-1 flex flex-col items-center gap-1">
                                  <span className="text-[10px] text-slate-300 font-bold">{val}</span>
                                  <div className="w-full bg-navy-800 rounded-t-lg h-24 flex items-end p-0.5">
                                    <div className={`w-full rounded-t-md ${metricLabels[metricKey].color}`} style={{ height: `${heightPct}%` }} />
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                          <div className="flex justify-between px-2 pt-1.5 text-[10px] text-slate-400">
                            {currentStore.performance.map((pt, i) => (
                              <span key={i} className="flex-1 text-center">{pt.month}</span>
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div className="h-32 rounded-xl border border-dashed border-slate-700 flex flex-col items-center justify-center text-xs text-amber-300 p-3 text-center">
                          <span>実績データ未登録</span>
                          <button onClick={() => setActiveMenu("reviews")} className="mt-2 bg-navy-800 text-cyan-300 px-3 py-1 rounded border border-cyan-500/30">
                            ＋ 月次実績を入力する
                          </button>
                        </div>
                      )}
                    </section>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <MainApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
