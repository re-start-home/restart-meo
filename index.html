      constructor(props) {
        super(props);
        this.state = { hasError: false, errorText: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorText: String(error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-navy-950 text-white flex flex-col items-center justify-center p-6 text-center">
              <div className="max-w-md bg-navy-900 border border-rose-500/50 rounded-2xl p-6 space-y-4">

                <h2 className="text-base font-bold text-rose-300">一時的な描画エラーを検知・保護しました</h2>
                <p className="text-xs text-slate-300 break-all bg-navy-950 p-3 rounded-lg border border-slate-800">
                  {this.state.errorText}
                </p>
                <button
                  onClick={() => window.location.reload()}
                  className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs"
                >
                  画面を再読み込みする
                </button>
              </div>
            </div>
          );
        }

      // --- CSVインポート ---
      const handleCsvImport = async (e) => {
        e.preventDefault();
        if (!supabase || !csvStoreId || !csvText.trim()) return;
        const lines = csvText.trim().split(/\r?\n/);
        let inserted = 0;
        let skipped = 0;
        const errors = [];
        const existingSet = new Set(
          dbKeywords.filter(k => k.store_id === csvStoreId).map(k => k.keyword.toLowerCase())
        );

        for (let i = 0; i < lines.length; i++) {
          const raw = lines[i].trim();
          if (!raw) continue;
          const cols = raw.split(",").map(c => c.trim());
          const word = cols[0];
          const rankVal = cols[1] ? Number(cols[1]) : null;

          if (i === 0 && (word.toLowerCase() === "keyword" || word === "キーワード")) continue;
          if (word.length < 2) {
            errors.push(`${i + 1}行目: キーワードが短すぎます (${raw})`);
            continue;
          }
          if (existingSet.has(word.toLowerCase())) {
            skipped++;
            continue;
          }

          const { data: kwData, error: kwErr } = await supabase.from("keywords").insert({
            store_id: csvStoreId,
            keyword: word,
            created_by: session?.user?.id || null
          }).select().single();

          if (kwErr) {
            errors.push(`${i + 1}行目: DB保存エラー (${kwErr.message})`);
            continue;
          }

          existingSet.add(word.toLowerCase());
          inserted++;

          if (rankVal !== null && !isNaN(rankVal) && rankVal > 0) {
            await supabase.from("rank_measurements").insert({
              store_id: csvStoreId,
              keyword_id: kwData.id,
              rank_position: rankVal,
              source_type: "csv",
              recorded_by: session?.user?.id || null
            });
          }
        }

        await writeAuditLog("csv_import", "keywords", csvStoreId, { inserted, skipped });

        await refreshTables();
        setSelectedStoreId(csvStoreId);

                    </form>
                  </div>
                </div>
              )}

              {/* 📥 フェーズ7：CSV一括インポート */}
              {activeMenu === "csv" && (
                <div className="space-y-5">
                  <form onSubmit={handleCsvImport} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">📥 CSV一括インポート（重複チェック・エラー検証付き）</h2>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">インポート先の店舗 *</label>
                      <select required value={csvStoreId} onChange={e => setCsvStoreId(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">CSVデータ入力（1行につき「キーワード,順位」）</label>
                      <textarea rows="5" required placeholder={"岐阜駅 整体, 2\n岐阜市 骨盤矯正, 3"} value={csvText} onChange={e => setCsvText(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-3 text-white font-mono" />
                    </div>
                    <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">CSVインポートを実行</button>
                  </form>
                </div>
              )}

              {/* 🏢 会社管理 */}
              {activeMenu === "companies" && (
                <div className="space-y-5">
                  <form onSubmit={handleCreateOrg} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">🏢 顧客会社の新規登録</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <input type="text" required placeholder="会社名・屋号 *" value={newOrgName} onChange={e => setNewOrgName(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      <input type="email" placeholder="メール（任意）" value={newOrgEmail} onChange={e => setNewOrgEmail(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      <input type="text" placeholder="電話番号（任意）" value={newOrgPhone} onChange={e => setNewOrgPhone(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">会社を登録する</button>
                  </form>

                  <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-2 text-xs">
                    <h3 className="text-sm font-bold text-white mb-2">登録済み会社一覧（{dbOrgs.length}社）</h3>
                    {dbOrgs.map(o => (
                      <div key={o.id} className="p-3 rounded-xl bg-navy-800 border border-slate-700 flex justify-between items-center">
                        <span className="font-bold text-white text-sm">{o.name}</span>
                        <span className="text-emerald-400 font-bold">契約中</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 🏪 店舗管理 */}
              {activeMenu === "stores" && (
                <div className="space-y-5">
                  <form onSubmit={handleCreateStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">🏪 店舗の新規登録</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <select required value={newStoreOrgId} onChange={e => setNewStoreOrgId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 所属会社を選択 --</option>
                        {dbOrgs.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                      </select>
                      <input type="text" required placeholder="店舗名 *" value={newStoreName} onChange={e => setNewStoreName(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      <input type="text" placeholder="市区町村・番地" value={newStoreAddr} onChange={e => setNewStoreAddr(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">店舗を登録する</button>
                  </form>

                  <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-2 text-xs">
                    <h3 className="text-sm font-bold text-white mb-2">登録済み店舗一覧（{dbStores.length}店舗）</h3>
                    {dbStores.map(st => (
                      <div key={st.id} className="p-3 rounded-xl bg-navy-800 border border-slate-700 flex justify-between items-center">
                        <span className="font-bold text-white text-sm">🏪 {st.name}</span>
                        <button onClick={() => { setSelectedStoreId(st.id); setActiveMenu("dashboard"); }} className="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg">
                          ダッシュボードで表示 ➔
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 👥 ユーザー・権限管理 */}
              {activeMenu === "users" && (
                <div className="space-y-5">
                  <form onSubmit={handleAssignStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">👥 ユーザーへの店舗割り当て</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <select required value={assignUserId} onChange={e => setAssignUserId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- ユーザーを選択 --</option>
                        {dbProfiles.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.email})</option>)}
                      </select>
                      <select required value={assignStoreId} onChange={e => setAssignStoreId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                      <select value={assignRole} onChange={e => setAssignRole(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="client">顧客として閲覧許可</option>
                        <option value="staff">担当スタッフとして編集許可</option>
                      </select>
                    </div>
                    <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">割り当てを保存</button>
                  </form>
                </div>
              )}

              {/* 📊 メインダッシュボード */}
              {activeMenu === "dashboard" && (
                <div className="grid grid-cols-1 xl:grid-cols-12 gap-5">
                  <div className="xl:col-span-8 space-y-5">
                    {/* C. 検索順位マップ */}
                    <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-white">エリア別 検索順位マップ</h2>
                          <p className="text-xs text-slate-400 mt-0.5">店舗所在地: {currentStore.address}</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                          <select
                            value={selectedKwIndex}
                            onChange={(e) => setSelectedKwIndex(Number(e.target.value))}
                            className="bg-navy-800 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 font-medium"
                          >
                            {currentStore.keywords.map((kw, i) => (
                              <option key={kw.id} value={i}>🔑 {kw.word}</option>
                            ))}
                          </select>
                          <div className="bg-navy-800 border border-slate-700 text-xs text-slate-300 rounded-lg px-3 py-2">
                            📅 測定日: {currentKeyword.date}
                          </div>
                        </div>
                      </div>

                      {currentKeyword.pins && currentKeyword.pins.length > 0 ? (
                        <div className="relative w-full h-72 sm:h-80 rounded-xl overflow-hidden border border-slate-700 bg-[#162238]">
                          <div
                            className="absolute inset-0 opacity-25"
                            style={{
                              backgroundImage:
                                "linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px)",
                              backgroundSize: "36px 36px"
                            }}
                          />
                          <div className="absolute top-3 left-3 bg-navy-950/90 border border-slate-700 rounded-xl px-3 py-2 shadow-lg">
                            <div className="text-[11px] text-slate-400">選択キーワード</div>
                            <div className="text-xs sm:text-sm font-bold text-white">{currentKeyword.word}</div>
                          </div>
                          <div className="absolute top-3 right-3 bg-navy-950/90 border border-slate-700 rounded-xl px-3 py-2 text-right shadow-lg">
                            <div className="text-[11px] text-slate-400">最新順位</div>
                            <div className="text-sm sm:text-base font-black text-emerald-400">{currentKeyword.avgRank}位</div>
                          </div>
                          {currentKeyword.pins.map(pin => (
                            <div
                              key={pin.id}
                              style={{ top: pin.top, left: pin.left }}
                              className="absolute -translate-x-1/2 -translate-y-1/2"
                            >
                              <div className={`w-8 h-8 sm:w-9 sm:h-9 rounded-full border-2 flex items-center justify-center font-black text-xs sm:text-sm shadow-lg ${getPinColor(pin.rank)}`}>
                                {pin.rank}
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="w-full h-60 rounded-xl border-2 border-dashed border-slate-700 bg-navy-950/60 flex flex-col items-center justify-center p-6 text-center">
                          <h3 className="text-sm font-bold text-amber-300">キーワードまたは順位データが未登録です</h3>
                          <button onClick={() => setActiveMenu("keywords")} className="mt-3 bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-xl">
                            ＋ キーワード・順位を登録する
                          </button>
                        </div>
                      )}
                    </section>

                    {/* D. プロフィール充実度 ＆ 改善タスク */}
                    <section className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                        <h3 className="text-sm sm:text-base font-bold text-white mb-1">プロフィール充実度</h3>
                        <p className="text-[11px] text-slate-400 mb-4">※Re.Start独自のMEO評価基準による算出値</p>
                        <div className="space-y-4">
                          {currentStore.profileScores.map(item => (
                            <div key={item.id}>
                              <div className="flex items-center justify-between text-xs mb-1">
                                <span className="font-medium text-slate-200">{item.label}</span>
                                <span className="font-bold text-white">{item.score}%</span>
                              </div>
                              <div className="w-full h-2.5 bg-navy-800 rounded-full overflow-hidden">
                                <div className={`h-full rounded-full ${item.color}`} style={{ width: `${item.score}%` }} />
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 flex flex-col justify-between shadow-xl">
                        <div>
                          <h3 className="text-sm sm:text-base font-bold text-white mb-1">GBP最適化・改善タスク</h3>
                          <p className="text-[11px] text-slate-400 mb-3">タップで完了状態を切り替え</p>
                          <div className="space-y-2.5">
                            {currentStore.tasks.map(task => (
                              <div
                                key={task.id}
                                onClick={() => toggleTask(task)}
                                className={`p-3 rounded-xl border text-xs flex items-start gap-2.5 cursor-pointer ${
                                  task.done ? "bg-navy-950/50 border-slate-800 text-slate-500 line-through" : "bg-navy-800/90 border-slate-700 text-slate-100"
                                }`}
                              >
                                <input type="checkbox" checked={task.done} onChange={() => {}} className="mt-0.5 h-4 w-4 accent-blue-500" />
                                <div className="flex-1 font-medium">{task.title}</div>
                              </div>
                            ))}
                          </div>
                        </div>

                        <button
                          onClick={() => setActiveMenu("reports")}
                          className="mt-4 w-full bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold text-xs py-2.5 rounded-xl shadow-lg"
                        >
                          📄 月次MEOレポート・PDF出力画面を開く ➔
                        </button>
                      </div>
                    </section>
                  </div>

                  {/* 右4カラム（E・F・G） */}
                  <div className="xl:col-span-4 space-y-5">
                    <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                      <div className="flex items-center justify-between mb-3">
                        <h3 className="text-sm sm:text-base font-bold text-white">口コミ管理サマリー</h3>
                        <button onClick={() => setActiveMenu("reviews")} className="text-[11px] text-cyan-400 underline">数値を編集</button>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="bg-navy-800/90 border border-slate-800 rounded-xl p-3">
                          <div className="text-amber-400 text-sm">★★★★★</div>
                          <div className="text-xl font-black text-white mt-1">{currentStore.reviews.avg}</div>
                          <div className="text-[11px] text-slate-400">総数: {currentStore.reviews.total}件</div>
                        </div>
                        <div className="bg-navy-800/90 border border-slate-800 rounded-xl p-3">
                          <div className="text-xs text-slate-300">返信済</div>
                          <div className="text-xl font-black text-cyan-400 mt-1">{currentStore.reviews.replied}件</div>
                          <div className="text-[11px] text-rose-400 font-semibold">未返信: {currentStore.reviews.unreplied}件</div>
                        </div>
                      </div>
                    </section>

                    <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                      <div className="flex items-center justify-between mb-2">
                        <h3 className="text-sm sm:text-base font-bold text-white">GBPパフォーマンス推移</h3>
                        <button onClick={() => setActiveMenu("reviews")} className="text-[11px] text-cyan-400 underline">実績を追加</button>
                      </div>
                      <div className="flex flex-wrap gap-1.5 mb-4">
                        {Object.entries(metricLabels).map(([k, info]) => (
                          <button
                            key={k}
                            onClick={() => setMetricKey(k)}
                            className={`text-[11px] px-2.5 py-1 rounded-lg font-medium ${
                              metricKey === k ? "bg-blue-600 text-white" : "bg-navy-800 text-slate-400"
                            }`}
                          >
                            {info.name}
                          </button>
                        ))}
                      </div>
                      {currentStore.performance && currentStore.performance.length > 0 ? (
                        <div>
                          <div className="h-36 flex items-end justify-between gap-2 pt-4 px-2 border-b border-slate-800">
                            {currentStore.performance.map((pt, i) => {
                              const val = Number(pt[metricKey]) || 0;
                              const heightPct = Math.max(12, Math.round((val / maxMetricValue) * 100));
                              return (
                                <div key={i} className="flex-1 flex flex-col items-center gap-1">
                                  <span className="text-[10px] text-slate-300 font-bold">{val}</span>
                                  <div className="w-full bg-navy-800 rounded-t-lg h-24 flex items-end p-0.5">
                                    <div className={`w-full rounded-t-md ${metricLabels[metricKey].color}`} style={{ height: `${heightPct}%` }} />
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                          <div className="flex justify-between px-2 pt-1.5 text-[10px] text-slate-400">
                            {currentStore.performance.map((pt, i) => (
                              <span key={i} className="flex-1 text-center">{pt.month}</span>
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div className="h-32 rounded-xl border border-dashed border-slate-700 flex flex-col items-center justify-center text-xs text-amber-300 p-3 text-center">
                          <span>実績データ未登録</span>
                          <button onClick={() => setActiveMenu("reviews")} className="mt-2 bg-navy-800 text-cyan-300 px-3 py-1 rounded border border-cyan-500/30">
                            ＋ 月次実績を入力する
                          </button>
                        </div>
                      )}
                    </section>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <MainApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
