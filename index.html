    // モデル店舗データ（イロハ 金山様 ＋ 岐阜駅前院）
    const DEMO_STORES = [
      {

          searchKeywords: [

            { type: "非指名検索(地域×業態)", badgeColor: "bg-emerald-100 text-emerald-800", word: "金山 スナック", desc: "エリアを絞って確実にお店を探している、来店意欲の高い新規顧客。" }
          ]
        },
        keywords: [
          {
            id: "k1", word: "金山 スナック", date: "2026-09-30", avgRank: 2.3, prevRank: 3.5,
            pins: [
              { id: 1, area: "金山駅北口", top: "45%", left: "46%", rank: 1 },
              { id: 2, area: "金山駅南口", top: "58%", left: "54%", rank: 2 },
              { id: 3, area: "アスナル金山", top: "32%", left: "42%", rank: 2 },
              { id: 4, area: "東別院エリア", top: "25%", left: "62%", rank: 3 },
              { id: 5, area: "尾頭橋エリア", top: "55%", left: "28%", rank: 4 },
              { id: 6, area: "沢上エリア", top: "68%", left: "66%", rank: 5 }
            ]
          },
          { id: "k2", word: "イロハ", date: "2026-09-30", avgRank: 1.0, prevRank: 1.2, pins: [{ id: 1, area: "金山駅前", top: "48%", left: "50%", rank: 1 }] }
        ],
        profileScores: [
          { id: "s1", label: "基本情報・カテゴリ設定", score: 95, color: "bg-emerald-400", note: "主/副カテゴリ設定済" },
          { id: "s2", label: "営業時間・特別営業時間", score: 85, color: "bg-cyan-400", note: "通常営業時間設定済" },
          { id: "s3", label: "写真・店内画像の充実度", score: 75, color: "bg-amber-400", note: "定期的な写真追加を推奨" },
          { id: "s4", label: "メニュー・サービス登録", score: 88, color: "bg-blue-500", note: "主要メニュー登録済" }
        ],
        tasks: [
          { id: "t1", title: "おすすめドリンク・店内写真の最新情報投稿（月2〜4回）", priority: "高", done: false },
          { id: "t2", title: "初回限定クーポン・わかりやすい料金体系の明記", priority: "高", done: false },
          { id: "t3", title: "高評価口コミへの丁寧な返信によるファン化", priority: "中", done: true }
        ],
        reviews: {
          avg: 4.6, total: 33, newCount: 3, replied: 28, unreplied: 5, replyRate: 85, positiveRate: 94,
          dist: [
            { star: "★5", pct: 73, count: 24, color: "bg-emerald-400" },
            { star: "★4", pct: 21, count: 7, color: "bg-cyan-400" },
            { star: "★3", pct: 6, count: 2, color: "bg-blue-400" },
            { star: "★2", pct: 0, count: 0, color: "bg-amber-400" },
            { star: "★1", pct: 0, count: 0, color: "bg-rose-500" }
          ]
        },
        performance: [
          { month: "4月", search: 2100, profile: 1280, web: 115, call: 19, route: 42 },
          { month: "5月", search: 2290, profile: 1390, web: 128, call: 22, route: 48 },
          { month: "6月", search: 2410, profile: 1480, web: 136, call: 23, route: 50 },
          { month: "7月", search: 2580, profile: 1590, web: 149, call: 25, route: 55 },
          { month: "8月", search: 2740, profile: 1710, web: 162, call: 28, route: 61 },
          { month: "9月", search: 2917, profile: 1830, web: 176, call: 30, route: 66 }
        ],
        citations: [
          { label: "検索経由表示", value: "2,917回" },
          { label: "マップ経由表示", value: "1,830回" },
          { label: "WEBアクセス", value: "176回" },
          { label: "ルート検索数", value: "66回" },
          { label: "通話数", value: "30回" },
          { label: "NAP統一スコア", value: "92%" }
        ]
      }
    ];

    function mapDbStore(dbStore, orgMap, kws, ranks, revs, posts, perfs) {
      const orgName = orgMap[dbStore.organization_id]?.name || "登録企業";
      const baseScore = Number(dbStore.profile_strength_score) || 86;
      const storeKws = kws.filter(k => k.store_id === dbStore.id);
      const storeRevs = revs.filter(r => r.store_id === dbStore.id);
      const latestRev = storeRevs[0];
      const totalRev = latestRev ? Number(latestRev.total_reviews) : 33;
      const avgRating = latestRev ? Number(latestRev.average_rating) : 4.6;
      const repliedRev = latestRev ? Number(latestRev.replied_count) : 28;
      const unrepliedRev = latestRev ? Number(latestRev.unreplied_count) : 5;
      const storePosts = posts.filter(p => p.store_id === dbStore.id);
      const storePerfs = perfs.filter(p => p.store_id === dbStore.id);
      const latestPerf = storePerfs[storePerfs.length - 1];

      const searchImp = latestPerf ? Number(latestPerf.search_views) : 2917;
      const mapImp = latestPerf ? Number(latestPerf.profile_views) : 1830;
      const webClicks = latestPerf ? Number(latestPerf.website_clicks) : 176;
      const dirReq = latestPerf ? Number(latestPerf.direction_requests) : 66;
      const callClk = latestPerf ? Number(latestPerf.call_clicks) : 30;
      const monthLabel = latestPerf ? latestPerf.target_month : "2026年9月度";

      return {
        id: dbStore.id, isDemo: false, organization_id: dbStore.organization_id,
        companyName: orgName, storeName: dbStore.name,
        address: `${dbStore.prefecture || ""}${dbStore.city || ""}${dbStore.address || ""}` || "住所未設定",
        gbpConnected: true, mapConnected: true, profileStrengthScore: baseScore,
        lastSync: "Supabase DB連動中",
        gbpMetrics: {
          targetMonthLabel: monthLabel, searchImpressions: searchImp, mapImpressions: mapImp,
          websiteClicks: webClicks, directionRequests: dirReq, callClicks: callClk,
          monthlyPostCount: storePosts.length, monthlyPhotoAdded: storePosts.length * 2,
          searchKeywords: [
            { type: "指名検索", badgeColor: "bg-blue-100 text-blue-700", word: storeKws[0]?.keyword || dbStore.name, desc: "既に店舗を知っている顕在顧客。リピーターや口コミ・紹介経由。" },
            { type: "非指名検索(業態)", badgeColor: "bg-amber-100 text-amber-800", word: storeKws[1]?.keyword || "スナック", desc: "近隣で店舗を探している新規の潜在顧客。" },
            { type: "非指名検索(地域×業態)", badgeColor: "bg-emerald-100 text-emerald-800", word: storeKws[2]?.keyword || `${dbStore.city || "金山"} スナック`, desc: "エリアを絞って確実にお店を探している、来店意欲の高い新規顧客。" }
          ]
        },
        keywords: storeKws.length > 0 ? storeKws.map(k => {
          const r = ranks.find(rk => rk.keyword_id === k.id);
          const pos = r && r.rank_position ? Number(r.rank_position) : 2;
          return {
            id: k.id, word: k.keyword, date: r ? r.measured_date : "計測済", avgRank: pos, prevRank: pos + 1,
            pins: [
              { id: 1, area: "店舗中心", top: "48%", left: "48%", rank: Math.round(pos) },
              { id: 2, area: "北エリア", top: "30%", left: "52%", rank: Math.round(pos) + 1 },
              { id: 3, area: "南エリア", top: "66%", left: "44%", rank: Math.round(pos) }
            ]
          };
        }) : DEMO_STORES[0].keywords,
        profileScores: DEMO_STORES[0].profileScores,
        tasks: DEMO_STORES[0].tasks,
        reviews: {
          avg: avgRating, total: totalRev, newCount: 3, replied: repliedRev, unreplied: unrepliedRev,
          replyRate: totalRev > 0 ? Math.round((repliedRev / totalRev) * 100) : 85, positiveRate: 92,
          dist: DEMO_STORES[0].reviews.dist
        },
        performance: storePerfs.length > 0 ? storePerfs.map(p => ({
          month: p.target_month, search: Number(p.search_views), profile: Number(p.profile_views),
          web: Number(p.website_clicks), call: Number(p.call_clicks), route: Number(p.direction_requests)
        })) : DEMO_STORES[0].performance,
        citations: [
          { label: "データ種別", value: "Supabase DB" },
          { label: "検索経由表示", value: `${searchImp.toLocaleString()}回` },
          { label: "マップ経由表示", value: `${mapImp.toLocaleString()}回` },
          { label: "WEBアクセス", value: `${webClicks.toLocaleString()}回` },
          { label: "ルート / 通話", value: `${dirReq} / ${callClk}回` }
        ]
      };
    }

    function App() {
      const [sbUrl, setSbUrl] = useState(() => localStorage.getItem("restart_sb_url") || "");
      const [sbKey, setSbKey] = useState(() => localStorage.getItem("restart_sb_key") || "");
      const [showConfig, setShowConfig] = useState(false);

      const supabase = useMemo(() => {
        if (!sbUrl || !sbKey) return null;
        try { return window.supabase.createClient(sbUrl.trim(), sbKey.trim()); } catch (e) { return null; }
      }, [sbUrl, sbKey]);

      const [session, setSession] = useState(null);
      const [demoBypass, setDemoBypass] = useState(false);
      const [authMode, setAuthMode] = useState("login");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [authMsg, setAuthMsg] = useState("");

      const [role, setRole] = useState("admin");
      const [activeMenu, setActiveMenu] = useState("dashboard"); // 初期画面は必ずダッシュボード
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedStoreId, setSelectedStoreId] = useState("demo-iroha");
      const [selectedKwIndex, setSelectedKwIndex] = useState(0);
      const [metricKey, setMetricKey] = useState("search");
      const [demoStoreList, setDemoStoreList] = useState(DEMO_STORES);
      const [notice, setNotice] = useState("");

      const [dbOrgs, setDbOrgs] = useState([]);
      const [dbStores, setDbStores] = useState([]);
      const [dbKeywords, setDbKeywords] = useState([]);
      const [dbRanks, setDbRanks] = useState([]);
      const [dbReviews, setDbReviews] = useState([]);
      const [dbPosts, setDbPosts] = useState([]);
      const [dbPerf, setDbPerf] = useState([]);

      // 入力フォーム用
      const [newOrgName, setNewOrgName] = useState("");
      const [newStoreOrgId, setNewStoreOrgId] = useState("");
      const [newStoreName, setNewStoreName] = useState("");
      const [newStoreCity, setNewStoreCity] = useState("名古屋市");
      const [targetStoreId, setTargetStoreId] = useState("");
      const [newKwText, setNewKwText] = useState("");
      const [newRankPos, setNewRankPos] = useState("2");
      const [revAvg, setRevAvg] = useState("4.6");
      const [revTotal, setRevTotal] = useState("33");
      const [perfMonth, setPerfMonth] = useState("2026年9月度");
      const [perfSearch, setPerfSearch] = useState("2917");
      const [perfMap, setPerfMap] = useState("1830");
      const [perfWeb, setPerfWeb] = useState("176");
      const [perfRoute, setPerfRoute] = useState("66");
      const [perfCall, setPerfCall] = useState("30");
      const [postTitle, setPostTitle] = useState("");
      const [csvText, setCsvText] = useState("");
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      // レポート考察文（自動生成＋編集可能）
      const [repMonth, setRepMonth] = useState("2026年9月度");
      const [insightSearch, setInsightSearch] = useState("");
      const [insightReview, setInsightReview] = useState("");
      const [nextAct1, setNextAct1] = useState("");
      const [nextAct2, setNextAct2] = useState("");
      const [nextAct3, setNextAct3] = useState("");
      const [showEditor, setShowEditor] = useState(false);

      const notify = (m) => { setNotice(m); setTimeout(() => setNotice(""), 4000); };

      useEffect(() => {
        if (!supabase) return;
        supabase.auth.getSession().then(({ data }) => {
          if (data?.session) { setSession(data.session); refreshDb(); }
        });
        const { data: sub } = supabase.auth.onAuthStateChange((_ev, s) => {
          setSession(s);
          if (s) refreshDb();
        });
        return () => sub?.subscription?.unsubscribe();
      }, [supabase]);

      const refreshDb = async () => {
        if (!supabase) return;
        const [orgs, stores, kws, ranks, revs, posts, perfs] = await Promise.all([
          supabase.from("organizations").select("*").order("created_at", { ascending: false }),
          supabase.from("stores").select("*").order("created_at", { ascending: false }),
          supabase.from("keywords").select("*").order("created_at", { ascending: false }),
          supabase.from("rank_measurements").select("*").order("measured_date", { ascending: false }),
          supabase.from("review_snapshots").select("*").order("snapshot_date", { ascending: false }),
          supabase.from("post_records").select("*").order("posted_at", { ascending: false }),
          supabase.from("performance_snapshots").select("*").order("created_at", { ascending: true })
        ]);
        setDbOrgs(orgs.data || []);
        setDbStores(stores.data || []);
        setDbKeywords(kws.data || []);
        setDbRanks(ranks.data || []);
        setDbReviews(revs.data || []);
        setDbPosts(posts.data || []);
        setDbPerf(perfs.data || []);
        if (orgs.data?.length && !newStoreOrgId) setNewStoreOrgId(orgs.data[0].id);
        if (stores.data?.length && !targetStoreId) setTargetStoreId(stores.data[0].id);
      };

      const allStores = useMemo(() => {
        const orgMap = {};
        dbOrgs.forEach(o => { orgMap[o.id] = o; });
        const real = dbStores.map(s => mapDbStore(s, orgMap, dbKeywords, dbRanks, dbReviews, dbPosts, dbPerf));
        return [...real, ...demoStoreList];
      }, [dbStores, dbOrgs, dbKeywords, dbRanks, dbReviews, dbPosts, dbPerf, demoStoreList]);

      const currentStore = useMemo(() => {
        return allStores.find(s => s.id === selectedStoreId) || allStores[0] || DEMO_STORES[0];
      }, [allStores, selectedStoreId]);

      const currentKeyword = currentStore.keywords[selectedKwIndex] || currentStore.keywords[0];
      const visibleMenus = MENU_ITEMS.filter(m => m.roles.includes(role));
      const mData = currentStore.gbpMetrics;

      // 店舗データに応じて4ページ目の考察テキストを自動セット
      useEffect(() => {
        setRepMonth(mData.targetMonthLabel || "2026年9月度");
        setInsightSearch(`今月は検索経由での表示が${mData.searchImpressions.toLocaleString()}回と非常に好調でした。キーワード分析からもわかる通り、「${mData.searchKeywords[0]?.word || currentStore.storeName}」「${mData.searchKeywords[2]?.word || "地域×業態"}」といった顕在層（すでに目的や店舗を絞っているユーザー）からのアプローチが多いのが特徴です。ウェブサイトへのアクセス数（${mData.websiteClicks.toLocaleString()}回）もしっかりと獲得できており、認知から興味関心への移行は成功しています。`);
        setInsightReview(`平均評価${currentStore.reviews.avg}、累計${currentStore.reviews.total}件という素晴らしい実績を維持されています。「接客が良い」「〇〇が美味しい」といった高評価の定性的なクチコミが多く寄せられており、これが新規ユーザーへの強力な来店動機（ソーシャルプルーフ）として機能しています。`);
        setNextAct1(`今月は投稿・写真追加が${mData.monthlyPostCount}件でした。マップ露出を底上げするためには、定期的な情報発信が不可欠です。おすすめドリンクや店内の雰囲気などの写真を添えた「最新情報の投稿」を月2〜4回実施することを推奨します。`);
        setNextAct2(`ルート検索に対して通話数がやや控えめです。迷っている層の背中を押すため、初回限定のクーポンや、わかりやすい料金体系を明記し、直接予約へのハードルを下げる施策が有効です。`);
        setNextAct3(`寄せられている高評価口コミに対し、店舗から丁寧な返信を行うことでリピーターのロイヤリティを高めます。温かいコミュニケーションを見せることで、新規ユーザーの安心感にも直結します。`);
      }, [currentStore]);

      // Page 1 ➔ Page 2 ➔ Page 3 ➔ Page 4 を1枚ずつ順番通りにA4横で撮影・結合するPDF出力
      const handleDownloadPdf = async () => {
        if (!window.html2canvas || !window.jspdf) { window.print(); return; }
        setIsGeneratingPdf(true);
        notify("📄 Page 1 ➔ Page 4 の順番通りにA4横PDFを生成中です（約5秒お待ちください）...");
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
          const ids = ["pdf-page-1", "pdf-page-2", "pdf-page-3", "pdf-page-4"];
          for (let i = 0; i < ids.length; i++) {
            const el = document.getElementById(ids[i]);
            if (!el) continue;
            const canvas = await window.html2canvas(el, {
              scale: 2, useCORS: true, backgroundColor: "#ffffff", width: 1040, height: 735, windowWidth: 1200
            });
            const img = canvas.toDataURL("image/jpeg", 0.96);
            if (i > 0) pdf.addPage("a4", "landscape");
            pdf.addImage(img, "JPEG", 0, 0, 297, 210);
          }
          pdf.save(`MEOコンサルティングレポート（${currentStore.storeName}様）_${repMonth}.pdf`);
          notify("✅ 全4ページ順番通りのPDFダウンロードが完了しました！");
        } catch (e) {
          window.print();
        } finally {
          setIsGeneratingPdf(false);
        }
      };

      // 各種DB保存処理
      const handleCreateOrg = async (e) => {
        e.preventDefault();
        if (!supabase || !newOrgName.trim()) return;

                <form onSubmit={handleCreateOrg} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">🏢 会社管理（新規クライアント企業登録）</h2>
                  <input type="text" required placeholder="会社名・屋号 *" value={newOrgName} onChange={e => setNewOrgName(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-3 text-white" />
                  <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">会社を登録する</button>
                </form>
              )}

              {/* 🏪 3. 店舗管理 */}
              {activeMenu === "stores" && (
                <form onSubmit={handleCreateStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">🏪 店舗管理（新規店舗登録）</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select required value={newStoreOrgId} onChange={e => setNewStoreOrgId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="">-- 所属会社を選択 --</option>
                      {dbOrgs.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                    </select>
                    <input type="text" required placeholder="店舗名 (例: イロハ 金山) *" value={newStoreName} onChange={e => setNewStoreName(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                    <input type="text" placeholder="エリア名 (例: 金山)" value={newStoreCity} onChange={e => setNewStoreCity(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">店舗を登録する</button>
                </form>
              )}

              {/* 📍 4. 検索順位管理 ＆ 🔑 5. キーワード管理 */}
              {(activeMenu === "rankings" || activeMenu === "keywords") && (
                <form onSubmit={handleAddKwAndRank} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">🔑 キーワード ＆ 検索順位の登録</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select required value={targetStoreId} onChange={e => setTargetStoreId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="">-- 対象店舗を選択 --</option>
                      {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <input type="text" required placeholder="対策キーワード (例: 金山 スナック)" value={newKwText} onChange={e => setNewKwText(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                    <input type="number" min="1" max="100" required placeholder="順位 (位)" value={newRankPos} onChange={e => setNewRankPos(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">キーワードと順位を記録する</button>
                </form>
              )}

              {/* 💬 6. 口コミ管理 ＆ 📝 7. 投稿管理 ＆ 📥 9. CSV ＆ 👥 10. 権限 ＆ ⚙️ 11. 設定 */}
              {["reviews", "posts", "csv", "users", "settings"].includes(activeMenu) && (
                <div className="space-y-5">
                  <div className="bg-navy-900 border border-emerald-500/40 rounded-2xl p-5 space-y-3 text-xs">
                    <h2 className="text-base font-bold text-white">⚡ GBPデータ自動収集 ＆ 4枚組レポート即時反映</h2>
                    <p className="text-slate-300">選択した店舗に対して、Googleビジネスプロフィールの表示回数（検索/マップ）・WEB・ルート・通話・クチコミ評価を一括自動収集し、4ページレポートへ反映します。</p>
                    <div className="flex flex-wrap gap-3">
                      <select value={targetStoreId} onChange={e => setTargetStoreId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 対象店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                      <button type="button" onClick={handleAutoCollectGbp} className="bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black px-5 py-2.5 rounded-xl shadow-lg">
                        ⚡ GBPデータを自動収集して4枚組レポートを生成する
                      </button>
                    </div>
                  </div>

                  <form onSubmit={handleSaveMetrics} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h3 className="text-sm font-bold text-cyan-300">💬 口コミ・月次パフォーマンス数値の手動調整</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                      <div><label className="block text-slate-400 mb-1">対象月</label><input type="text" value={perfMonth} onChange={e => setPerfMonth(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-slate-400 mb-1">口コミ件数</label><input type="number" value={revTotal} onChange={e => setRevTotal(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-slate-400 mb-1">平均評価(★)</label><input type="number" step="0.1" value={revAvg} onChange={e => setRevAvg(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-slate-400 mb-1">検索経由表示</label><input type="number" value={perfSearch} onChange={e => setPerfSearch(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-slate-400 mb-1">マップ経由表示</label><input type="number" value={perfMap} onChange={e => setPerfMap(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-slate-400 mb-1">WEBアクセス</label><input type="number" value={perfWeb} onChange={e => setPerfWeb(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-slate-400 mb-1">ルート検索</label><input type="number" value={perfRoute} onChange={e => setPerfRoute(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                      <div><label className="block text-slate-400 mb-1">通話数</label><input type="number" value={perfCall} onChange={e => setPerfCall(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded p-2 text-white" /></div>
                    </div>
                    <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">数値を保存してダッシュボード＆レポートに反映</button>
                  </form>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
