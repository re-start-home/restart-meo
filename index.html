              {/* 選択メニューがダッシュボード以外の時の案内バー */}
              {activeMenu !== "dashboard" && (
                <div className="bg-blue-500/10 border border-blue-500/30 rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-bold text-blue-300">
                      現在「{MENU_ITEMS.find(m => m.key === activeMenu)?.label}」セクションを選択中です
                    </h2>
                    <p className="text-xs text-slate-300 mt-1">
                      フェーズ1ではメインダッシュボードのUI/UXを実装しています。各専用管理画面（DB連動）はフェーズ5〜8で順番に接続します。
                    </p>
                  </div>
                  <button
                    onClick={() => setActiveMenu("dashboard")}
                    className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-2 rounded-lg flex-shrink-0"
                  >
                    ダッシュボードへ戻る
                  </button>
                </div>
              )}

              {/* 12カラム・レスポンシブグリッド（中央8カラム ＋ 右4カラム） */}
              <div className="grid grid-cols-1 xl:grid-cols-12 gap-5">
                {/* 中央エリア（8カラム分） */}
                <div className="xl:col-span-8 space-y-5">
                  {/* C. 中央上部：検索順位マップパネル */}
                  <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <h2 className="text-base sm:text-lg font-bold text-white">エリア別 検索順位マップ</h2>
                          <span className="text-[11px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full">
                            デモ計測データ
                          </span>
                        </div>
                        <p className="text-xs text-slate-400 mt-0.5">
                          店舗所在地: {currentStore.address}
                        </p>
                      </div>

                      {/* キーワード選択・測定日表示 */}
                      <div className="flex flex-wrap items-center gap-2">
                        <select
                          value={selectedKwIndex}
                          onChange={(e) => setSelectedKwIndex(Number(e.target.value))}
                          className="bg-navy-800 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 font-medium"
                        >
                          {currentStore.keywords.map((kw, i) => (
                            <option key={kw.id} value={i}>🔑 {kw.word}</option>
                          ))}
                        </select>
                        <div className="bg-navy-800 border border-slate-700 text-xs text-slate-300 rounded-lg px-3 py-2">
                          📅 測定日: {currentKeyword.date}
                        </div>
                      </div>
                    </div>

                    {/* マップ表示部（未連携時は明確な未接続表示を出す） */}
                    {currentStore.mapConnected && currentKeyword.pins.length > 0 ? (
                      <div className="relative w-full h-72 sm:h-80 rounded-xl overflow-hidden border border-slate-700 bg-[#162238]">
                        {/* 地図風グリッド背景（CSS描画） */}
                        <div
                          className="absolute inset-0 opacity-25"
                          style={{
                            backgroundImage:
                              "linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px)",
                            backgroundSize: "36px 36px"
                          }}
                        />
                        {/* ヒートマップ風エリアカラー装飾 */}
                        <div className="absolute top-1/4 left-1/3 w-48 h-48 bg-emerald-500/25 rounded-full blur-2xl pointer-events-none" />
                        <div className="absolute top-1/3 right-1/4 w-40 h-40 bg-amber-500/20 rounded-full blur-2xl pointer-events-none" />

                        {/* 道路・河川風の装飾ライン */}
                        <div className="absolute inset-x-0 top-1/2 h-1 bg-slate-600/40 -rotate-6 pointer-events-none" />
                        <div className="absolute inset-y-0 left-1/2 w-1 bg-slate-600/40 rotate-12 pointer-events-none" />

                        {/* 左上キーワードバッジ */}
                        <div className="absolute top-3 left-3 bg-navy-950/90 border border-slate-700 rounded-xl px-3 py-2 shadow-lg">
                          <div className="text-[11px] text-slate-400">選択キーワード</div>
                          <div className="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-orange-400 inline-block"></span>
                            {currentKeyword.word}
                          </div>
                        </div>

                        {/* 右上平均順位バッジ */}
                        <div className="absolute top-3 right-3 bg-navy-950/90 border border-slate-700 rounded-xl px-3 py-2 text-right shadow-lg">
                          <div className="text-[11px] text-slate-400">エリア平均順位</div>
                          <div className="text-sm sm:text-base font-black text-emerald-400">
                            {currentKeyword.avgRank}位
                            <span className="text-[11px] text-cyan-300 font-normal ml-1.5">
                              (前回 {currentKeyword.prevRank}位)
                            </span>
                          </div>
                        </div>

                        {/* 順位ピン配置 */}
                        {currentKeyword.pins.map(pin => (
                          <div
                            key={pin.id}
                            style={{ top: pin.top, left: pin.left }}
                            className="absolute -translate-x-1/2 -translate-y-1/2 group cursor-pointer"
                          >
                            <div
                              className={`w-8 h-8 sm:w-9 sm:h-9 rounded-full border-2 flex items-center justify-center font-black text-xs sm:text-sm shadow-lg transition transform group-hover:scale-125 ${getPinColor(pin.rank)}`}
                            >
                              {pin.rank}
                            </div>
                            <div className="opacity-0 group-hover:opacity-100 transition bg-navy-950 text-white text-[10px] px-2 py-1 rounded border border-slate-700 whitespace-nowrap absolute left-1/2 -translate-x-1/2 -top-7 pointer-events-none z-20">
                              {pin.area}: {pin.rank}位
                            </div>
                          </div>
                        ))}

                        {/* 凡例バー */}
                        <div className="absolute bottom-3 left-3 right-3 flex flex-wrap items-center justify-between gap-2 bg-navy-950/90 border border-slate-800 rounded-lg px-3 py-1.5 text-[11px]">
                          <div className="flex items-center gap-3">
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"></span>1〜3位(上位表示)</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-cyan-400 inline-block"></span>4〜10位</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>11位以下</span>
                          </div>
                          <span className="text-slate-400">※ピンをタップで地点名表示</span>
                        </div>
                      </div>
                    ) : (
                      /* 地図データ未連携時の明確な表示（要件C準拠） */
                      <div className="w-full h-72 rounded-xl border-2 border-dashed border-slate-700 bg-navy-950/60 flex flex-col items-center justify-center p-6 text-center">
                        <div className="text-3xl mb-2">🗺️</div>
                        <h3 className="text-sm sm:text-base font-bold text-amber-300">
                          グリッド地図データが未連携です
                        </h3>
                        <p className="text-xs text-slate-400 max-w-md mt-1 leading-relaxed">
                          この店舗はエリア座標計測データまたは地図APIが未接続のため、マップピンを表示していません（架空の順位データは表示しません）。キーワード全体の平均順位（手動記録）：<strong className="text-white">{currentKeyword.avgRank}位</strong>
                        </p>
                      </div>
                    )}
                  </section>

                  {/* D. 中央下部：店舗の最適化状況（2カラムカード） */}
                  <section className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    {/* 左：プロフィール充実度 */}
                    <div className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 flex flex-col justify-between shadow-xl">
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-1">
                          <h3 className="text-sm sm:text-base font-bold text-white">プロフィール充実度</h3>
                          <button
                            onClick={() => setShowCriteriaModal(!showCriteriaModal)}
                            className="text-[11px] text-cyan-400 underline hover:text-cyan-300"
                          >
                            算出基準を表示
                          </button>
                        </div>
                        <p className="text-[11px] text-slate-400 mb-4">
                          ※Google公式スコアではなく、Re.Start独自のMEO評価基準による算出値です。
                        </p>

                        {showCriteriaModal && (
                          <div className="mb-4 p-3 rounded-xl bg-navy-950 border border-cyan-500/40 text-[11px] text-slate-300 space-y-1">
                            <div className="font-bold text-cyan-300 mb-1">【Re.Start 充実度評価基準（各100点満点）】</div>
                            <div>・基本情報：店名、カテゴリ、住所、電話、URL、説明文300字以上</div>
                            <div>・営業情報：通常営業時間、祝日等の特別営業時間、属性設定</div>
                            <div>・写真充実度：外観・内観・スタッフ写真計20枚以上＋月次更新</div>
                            <div>・メニュー：写真・価格付きコース/商品の5件以上の登録</div>
                          </div>
                        )}

                        <div className="space-y-4">
                          {currentStore.profileScores.map(item => (
                            <div key={item.id}>
                              <div className="flex items-center justify-between text-xs mb-1">
                                <span className="font-medium text-slate-200">{item.label}</span>
                                <span className="font-bold text-white">{item.score}%</span>
                              </div>
                              <div className="w-full h-2.5 bg-navy-800 rounded-full overflow-hidden">
                                <div
                                  className={`h-full rounded-full ${item.color}`}
                                  style={{ width: `${item.score}%` }}
                                />
                              </div>
                              <div className="text-[11px] text-slate-400 mt-1">{item.note}</div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="mt-5 pt-3 border-t border-slate-800 flex items-center justify-between">
                        <span className="text-xs text-slate-400">GBP API連携状態:</span>
                        <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                          currentStore.gbpConnected
                            ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
                            : "bg-rose-500/20 text-rose-300 border border-rose-500/30"
                        }`}>
                          {currentStore.gbpConnected ? "● OAuth連携済（デモ）" : "▲ 未連携（手動モード）"}
                        </span>
                      </div>
                    </div>

                    {/* 右：Googleビジネスプロフィール最適化＆改善タスク */}
                    <div className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 flex flex-col justify-between shadow-xl">
                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <div>
                            <h3 className="text-sm sm:text-base font-bold text-white">GBP最適化・改善タスク</h3>
                            <p className="text-[11px] text-slate-400">タップで完了状態を切り替えできます</p>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <span className="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 flex items-center justify-center text-xs font-bold">
                              ✓
                            </span>
                            <span className="w-8 h-8 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 flex items-center justify-center text-xs font-bold">
                              !
                            </span>
                          </div>
                        </div>

                        <div className="space-y-2.5 mt-3">
                          {currentStore.tasks.map(task => (
                            <div
                              key={task.id}
                              onClick={() => toggleTask(task.id)}
                              className={`p-3 rounded-xl border text-xs flex items-start gap-2.5 cursor-pointer transition ${
                                task.done
                                  ? "bg-navy-950/50 border-slate-800 text-slate-500 line-through"
                                  : "bg-navy-800/90 border-slate-700 text-slate-100 hover:border-blue-500"
                              }`}
                            >
                              <input
                                type="checkbox"
                                checked={task.done}
                                onChange={() => {}}
                                className="mt-0.5 h-4 w-4 rounded accent-blue-500"
                              />
                              <div className="flex-1">
                                <div className="font-medium leading-snug">{task.title}</div>
                              </div>
                              <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                                task.priority === "高"
                                  ? "bg-rose-500/20 text-rose-300 border border-rose-500/30"
                                  : "bg-blue-500/20 text-blue-300 border border-blue-500/30"
                              }`}>
                                優先:{task.priority}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <button
                        onClick={() => setActiveMenu("reports")}
                        className="mt-5 w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold text-xs sm:text-sm py-2.5 rounded-xl shadow-lg shadow-blue-600/25 transition"
                      >
                        月次MEOレポート・改善提案書を確認
                      </button>
                    </div>
                  </section>
                </div>

                {/* 右側エリア（4カラム分：E・F・G） */}
                <div className="xl:col-span-4 space-y-5">
                  {/* E. 右上部：口コミ管理サマリー */}
                  <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-sm sm:text-base font-bold text-white">口コミ管理サマリー</h3>
                      <span className="text-[11px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                        新着 +{currentStore.reviews.newCount}件
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mb-3">
                      <div className="bg-navy-800/90 border border-slate-800 rounded-xl p-3">
                        <div className="text-amber-400 text-sm tracking-widest">★★★★★</div>
                        <div className="text-xl font-black text-white mt-1">
                          {currentStore.reviews.avg} <span className="text-xs font-normal text-slate-400">/ 5.0</span>
                        </div>
                        <div className="text-[11px] text-slate-400 mt-0.5">
                          総口コミ数: {currentStore.reviews.total}件
                        </div>
                      </div>

                      <div className="bg-navy-800/90 border border-slate-800 rounded-xl p-3">
                        <div className="text-xs text-slate-300 font-semibold">返信ステータス</div>
                        <div className="text-xl font-black text-cyan-400 mt-1">
                          {currentStore.reviews.replied} <span className="text-xs font-normal text-slate-400">件返信済</span>
                        </div>
                        <div className="text-[11px] text-rose-400 font-semibold mt-0.5">
                          未返信: {currentStore.reviews.unreplied}件
                        </div>
                      </div>
                    </div>

                    {/* 評価分布ミニバー */}
                    <div className="space-y-1.5 pt-2 border-t border-slate-800">
                      {currentStore.reviews.dist.map(d => (
                        <div key={d.star} className="flex items-center gap-2 text-[11px]">
                          <span className="w-7 text-amber-400 font-bold">{d.star}</span>
                          <div className="flex-1 h-2 bg-navy-800 rounded-full overflow-hidden">
                            <div className={`h-full ${d.color}`} style={{ width: `${d.pct}%` }} />
                          </div>
                          <span className="w-9 text-right text-slate-300">{d.count}件</span>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* F. 右中央部：GBP実績グラフ */}
                  <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                    <div className="flex items-center justify-between mb-2">
                      <h3 className="text-sm sm:text-base font-bold text-white">GBPパフォーマンス推移</h3>
                      <span className="text-[10px] text-slate-400">過去6ヶ月（デモ）</span>
                    </div>

                    {/* 指標切り替えボタン */}
                    <div className="flex flex-wrap gap-1.5 mb-4">
                      {Object.entries(metricLabels).map(([k, info]) => (
                        <button
                          key={k}
                          onClick={() => setMetricKey(k)}
                          className={`text-[11px] px-2.5 py-1 rounded-lg font-medium transition ${
                            metricKey === k
                              ? "bg-blue-600 text-white"
                              : "bg-navy-800 text-slate-400 hover:text-white"
                          }`}
                        >
                          {info.name}
                        </button>
                      ))}
                    </div>

                    {currentStore.gbpConnected && currentStore.performance.length > 0 ? (
                      <div>
                        <div className="h-40 flex items-end justify-between gap-2 pt-4 px-2 border-b border-slate-800">
                          {currentStore.performance.map((pt, i) => {
                            const val = pt[metricKey];
                            const heightPct = Math.max(12, Math.round((val / maxMetricValue) * 100));
                            return (
                              <div key={i} className="flex-1 flex flex-col items-center gap-1.5">
                                <span className="text-[10px] text-slate-300 font-bold">{val}</span>
                                <div className="w-full bg-navy-800 rounded-t-lg h-28 flex items-end p-0.5">
                                  <div
                                    className={`w-full rounded-t-md transition-all duration-300 ${metricLabels[metricKey].color}`}
                                    style={{ height: `${heightPct}%` }}
                                  />
                                </div>
                              </div>
                            );
                          })}
                        </div>
                        <div className="flex justify-between px-2 pt-2 text-[11px] text-slate-400">
                          {currentStore.performance.map((pt, i) => (
                            <span key={i} className="flex-1 text-center">{pt.month}</span>
                          ))}
                        </div>
                      </div>
                    ) : (
                      /* 未連携時の捏造防止表示（要件F準拠） */
                      <div className="h-44 rounded-xl border border-dashed border-slate-700 bg-navy-950/60 flex flex-col items-center justify-center p-4 text-center">
                        <p className="text-xs font-bold text-amber-300">Google実績指標 未連携</p>
                        <p className="text-[11px] text-slate-400 mt-1">
                          GBP APIが未接続のため、検索表示数やルート検索数は表示していません。
                        </p>
                      </div>
                    )}
                  </section>

                  {/* G. 右下部：口コミ・対策状況ドーナツゲージ */}
                  <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                    <h3 className="text-sm sm:text-base font-bold text-white mb-3">口コミ返信率・対策進捗</h3>
                    <div className="flex items-center justify-around gap-4">
                      {/* ドーナツチャート（CSS Conic Gradient） */}
                      <div
                        className="w-28 h-28 rounded-full flex items-center justify-center relative shadow-inner"
                        style={{
                          background: `conic-gradient(#10B981 0% 65%, #06B6D4 65% 88%, #F59E0B 88% 100%)`
                        }}
                      >
                        <div className="w-20 h-20 rounded-full bg-navy-900 flex flex-col items-center justify-center">
                          <span className="text-[10px] text-slate-400">返信達成率</span>
                          <span className="text-lg font-black text-white">{currentStore.reviews.replyRate}%</span>
                        </div>
                      </div>

                      <div className="space-y-2.5 text-xs">
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span>
                          <div>
                            <div className="text-slate-300 font-semibold">高評価比率 (★4〜5)</div>
                            <div className="text-white font-bold">{currentStore.reviews.positiveRate}%</div>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded-full bg-cyan-400 inline-block"></span>
                          <div>
                            <div className="text-slate-300 font-semibold">今月のGBP投稿実施</div>
                            <div className="text-white font-bold">{currentStore.citations[4].value}</div>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded-full bg-amber-400 inline-block"></span>
                          <div>
                            <div className="text-slate-300 font-semibold">残タスク数</div>
                            <div className="text-white font-bold">
                              {currentStore.tasks.filter(t => !t.done).length}件
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </section>
                </div>
              </div>
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
