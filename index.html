        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-navy-950 text-white flex flex-col items-center justify-center p-6 text-center">

                  再読み込みする
                </button>
              </div>
            </div>

    // DB店舗データを画面＆4ページレポート用に変換

      const orgName = orgMap[dbStore.organization_id]?.name || "登録企業";
      const baseScore = Number(dbStore.profile_strength_score) || 85;

      const storeKws = keywordsList.filter(k => k.store_id === dbStore.id);

        const kwRanks = ranksList.filter(r => r.keyword_id === kw.id);
        const latestRank = kwRanks[0];
        const prevRankObj = kwRanks[1];
        return {
          id: kw.id,
          word: kw.keyword,
          date: latestRank ? latestRank.measured_date : new Date(kw.created_at).toLocaleDateString("ja-JP"),
          avgRank: latestRank && latestRank.rank_position !== null ? Number(latestRank.rank_position) : "-",
          prevRank: prevRankObj && prevRankObj.rank_position !== null ? Number(prevRankObj.rank_position) : "-",
          pins: [
            { id: 1, area: "中心エリア", top: "48%", left: "48%", rank: latestRank && latestRank.rank_position ? Math.round(Number(latestRank.rank_position)) : 2 },
            { id: 2, area: "周辺北", top: "30%", left: "52%", rank: latestRank && latestRank.rank_position ? Math.round(Number(latestRank.rank_position)) + 1 : 3 },
            { id: 3, area: "周辺南", top: "66%", left: "45%", rank: latestRank && latestRank.rank_position ? Math.round(Number(latestRank.rank_position)) : 2 }
          ]
        };
      }) : [
        { id: "kw-empty", word: `${dbStore.city || "エリア"} ${dbStore.name}`, date: "-", avgRank: "-", prevRank: "-", pins: [] }
      ];

      const storeRevs = reviewsList.filter(r => r.store_id === dbStore.id);
      const latestRev = storeRevs[0];
      const totalRev = latestRev ? Number(latestRev.total_reviews) : 33;
      const avgRating = latestRev ? Number(latestRev.average_rating) : 4.6;
      const repliedRev = latestRev ? Number(latestRev.replied_count) : 28;
      const unrepliedRev = latestRev ? Number(latestRev.unreplied_count) : 5;
      const replyRate = totalRev > 0 ? Math.min(100, Math.round((repliedRev / totalRev) * 100)) : 85;

      const storePosts = postsList.filter(p => p.store_id === dbStore.id);
      const storePerfs = perfList.filter(p => p.store_id === dbStore.id);
      const latestPerf = storePerfs[storePerfs.length - 1];

      const searchImp = latestPerf ? Number(latestPerf.search_views) : 2917;
      const mapImp = latestPerf ? Number(latestPerf.profile_views) : 1830;
      const webClicks = latestPerf ? Number(latestPerf.website_clicks) : 176;
      const dirReq = latestPerf ? Number(latestPerf.direction_requests) : 66;
      const callClk = latestPerf ? Number(latestPerf.call_clicks) : 30;
      const monthLabel = latestPerf ? latestPerf.target_month : "2026年10月度";

      // 登録キーワードからSection 3の指名・非指名テーブルを自動構築
      const searchKwTable = storeKws.length > 0 ? storeKws.slice(0, 4).map((k, idx) => {
        const hasArea = dbStore.city && k.keyword.includes(dbStore.city.replace(/[市区町村]/g, ""));
        const isBrand = k.keyword.includes(dbStore.name.split(" ")[0]);
        if (isBrand || idx === 0 && storeKws.length >= 3) {
          return {
            type: "指名検索",
            badgeColor: "bg-blue-100 text-blue-700",
            word: k.keyword,
            desc: "既に店舗を知っている顕在顧客。リピーターや口コミ・紹介経由。"
          };
        }
        if (hasArea || k.keyword.includes(" ")) {
          return {
            type: "非指名検索(地域×業態)",
            badgeColor: "bg-emerald-100 text-emerald-800",
            word: k.keyword,
            desc: "エリアを絞って確実にお店を探している、来店意欲の高い新規顧客。"
          };
        }
        return {
          type: "非指名検索(業態)",
          badgeColor: "bg-amber-100 text-amber-800",
          word: k.keyword,
          desc: "近隣で該当ジャンルの店舗を探している新規の潜在顧客。"
        };
      }) : [
        { type: "指名検索", badgeColor: "bg-blue-100 text-blue-700", word: dbStore.name, desc: "既に店舗を知っている顕在顧客。リピーターや口コミ・紹介経由。" },
        { type: "非指名検索(業態)", badgeColor: "bg-amber-100 text-amber-800", word: "メイン業態キーワード", desc: "近隣で店舗を探している新規の潜在顧客。" },
        { type: "非指名検索(地域×業態)", badgeColor: "bg-emerald-100 text-emerald-800", word: `${dbStore.city || "地域"} 店舗検索`, desc: "エリアを絞って確実にお店を探している、来店意欲の高い新規顧客。" }
      ];

      return {
        id: dbStore.id,
        isDemo: false,
        organization_id: dbStore.organization_id,
        companyName: orgName,
        storeName: dbStore.name,
        prefecture: dbStore.prefecture || "",

        mapConnected: !!dbStore.map_connected || storeKws.length > 0,
        profileStrengthScore: baseScore,
        lastSync: dbStore.last_synced_at ? new Date(dbStore.last_synced_at).toLocaleString("ja-JP") : "DB連動中",
        gbpMetrics: {

          websiteClicks: webClicks,
          directionRequests: dirReq,
          callClicks: callClk,
          monthlyPostCount: storePosts.length,
          monthlyPhotoAdded: storePosts.length > 0 ? storePosts.length * 2 : 0,
          searchKeywords: searchKwTable

        keywords: formattedKeywords,
        profileScores: [
          { id: "s1", label: "基本情報・カテゴリ設定", score: baseScore, color: "bg-emerald-400", note: "DB登録店舗" },
          { id: "s2", label: "営業時間・特別営業時間", score: 85, color: "bg-cyan-400", note: "設定済" }

        tasks: [
          { id: "t-1", title: "最新情報の投稿および写真の定期追加", priority: "高", done: storePosts.length > 0 },
          { id: "t-2", title: "寄せられた高評価口コミへの丁寧な返信", priority: "中", done: unrepliedRev === 0 }
        ],
        reviews: {

          replied: repliedRev,

                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">対象月表記</label>
                      <input type="text" value={perfMonth} onChange={e => setPerfMonth(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">口コミ総数 (件)</label>
                      <input type="number" value={revTotal} onChange={e => setRevTotal(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">平均評価 (★)</label>
                      <input type="number" step="0.1" value={revAvg} onChange={e => setRevAvg(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">検索経由表示回数</label>
                      <input type="number" value={perfSearch} onChange={e => setPerfSearch(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">マップ経由表示回数</label>
                      <input type="number" value={perfProfile} onChange={e => setPerfProfile(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">WEBアクセス数</label>
                      <input type="number" value={perfWeb} onChange={e => setPerfWeb(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">ルート検索数</label>
                      <input type="number" value={perfRoute} onChange={e => setPerfRoute(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">通話数</label>
                      <input type="number" value={perfCall} onChange={e => setPerfCall(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                  </div>
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">
                    保存して4ページレポートに反映する
                  </button>
                </form>
              )}

              {/* 🏢 会社管理・🏪 店舗管理・その他の画面 */}
              {activeMenu === "companies" && (
                <form onSubmit={handleCreateOrg} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">🏢 顧客会社の新規登録</h2>
                  <input type="text" required placeholder="会社名・屋号 *" value={newOrgName} onChange={e => setNewOrgName(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                  <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">会社を登録する</button>
                </form>
              )}

              {activeMenu === "stores" && (
                <form onSubmit={handleCreateStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">🏪 店舗の新規登録</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select required value={newStoreOrgId} onChange={e => setNewStoreOrgId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="">-- 所属会社を選択 --</option>
                      {dbOrgs.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                    </select>
                    <input type="text" required placeholder="店舗名 (例: イロハ 金山)" value={newStoreName} onChange={e => setNewStoreName(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                    <input type="text" placeholder="エリア名 (例: 金山)" value={newStoreCity} onChange={e => setNewStoreCity(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">店舗を登録する</button>
                </form>
              )}

              {!["reports", "google_api", "dashboard", "reviews", "companies", "stores"].includes(activeMenu) && (
                <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 text-xs space-y-3">
                  <h2 className="text-base font-bold text-white">{MENU_ITEMS.find(m => m.key === activeMenu)?.label}</h2>
                  <p className="text-slate-400">左メニューの「📄 4枚組MEOレポート・PDF」または「🔗 GBP自動収集・API連携」から4ページレポート機能をお試しいただけます。</p>
                  <button onClick={() => setActiveMenu("reports")} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl">
                    4枚組レポート画面へ移動 ➔
                  </button>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <MainApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
