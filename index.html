    // DBから取得した実店舗データをダッシュボード構造に変換するヘルパー

      const baseScore = dbStore.profile_strength_score || 70;
      return {
        id: dbStore.id,
        isDemo: false,
        organization_id: dbStore.organization_id,
        companyName: orgName,
        storeName: dbStore.name,
        prefecture: dbStore.prefecture || "",
        city: dbStore.city || "",
        address: `${dbStore.prefecture || ""}${dbStore.city || ""}${dbStore.address || ""}` || "住所未設定",
        phone: dbStore.phone || "",
        website_url: dbStore.website_url || "",
        gbpConnected: !!dbStore.gbp_connected,
        mapConnected: !!dbStore.map_connected,
        profileStrengthScore: baseScore,
        lastSync: dbStore.last_synced_at ? new Date(dbStore.last_synced_at).toLocaleString("ja-JP") : "未同期（手動管理モード）",

    function App() {
      // --- Supabase接続設定 ---
      const [sbUrl, setSbUrl] = useState(() => localStorage.getItem("restart_sb_url") || DEFAULT_SUPABASE_URL);
      const [sbKey, setSbKey] = useState(() => localStorage.getItem("restart_sb_key") || DEFAULT_SUPABASE_ANON_KEY);
      const [showConfigModal, setShowConfigModal] = useState(false);

      const supabase = useMemo(() => {
        if (!sbUrl || !sbKey) return null;
        try {
          return window.supabase.createClient(sbUrl.trim(), sbKey.trim());
        } catch (e) {
          console.error(e);
          return null;
        }
      }, [sbUrl, sbKey]);

      // --- 認証・ユーザーステート ---
      const [session, setSession] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authMode, setAuthMode] = useState("login");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [signupRole, setSignupRole] = useState("admin");
      const [authMessage, setAuthMessage] = useState({ type: "", text: "" });
      const [demoBypass, setDemoBypass] = useState(false);

      // --- 実データベース（フェーズ4＆5）ステート ---
      const [dbOrgs, setDbOrgs] = useState([]);
      const [dbStores, setDbStores] = useState([]);
      const [dbProfiles, setDbProfiles] = useState([]);
      const [dbStoreAssigns, setDbStoreAssigns] = useState([]);
      const [dbOrgMembers, setDbOrgMembers] = useState([]);
      const [dbLoading, setDbLoading] = useState(false);
      const [actionNotice, setActionNotice] = useState("");

      // フォーム入力用ステート（会社追加）
      const [newOrgName, setNewOrgName] = useState("");
      const [newOrgEmail, setNewOrgEmail] = useState("");
      const [newOrgPhone, setNewOrgPhone] = useState("");

      // フォーム入力用ステート（店舗追加）
      const [newStoreOrgId, setNewStoreOrgId] = useState("");
      const [newStoreName, setNewStoreName] = useState("");
      const [newStorePref, setNewStorePref] = useState("岐阜県");
      const [newStoreCity, setNewStoreCity] = useState("岐阜市");
      const [newStoreAddr, setNewStoreAddr] = useState("");
      const [newStorePhone, setNewStorePhone] = useState("");
      const [newStoreScore, setNewStoreScore] = useState(80);

      // フォーム入力用ステート（担当者・顧客の店舗割り当て）
      const [assignUserId, setAssignUserId] = useState("");
      const [assignStoreId, setAssignStoreId] = useState("");
      const [assignRole, setAssignRole] = useState("client");

      // --- ダッシュボード表示ステート ---
      const [role, setRole] = useState("admin");
      const [activeMenu, setActiveMenu] = useState("dashboard");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedStoreId, setSelectedStoreId] = useState(DEMO_STORES[0].id);
      const [selectedKwIndex, setSelectedKwIndex] = useState(0);
      const [metricKey, setMetricKey] = useState("search");
      const [showCriteriaModal, setShowCriteriaModal] = useState(false);
      const [demoStoreList, setDemoStoreList] = useState(DEMO_STORES);

      const notify = (msg) => {
        setActionNotice(msg);
        setTimeout(() => setActionNotice(""), 4000);
      };

      // セッション監視
      useEffect(() => {
        if (!supabase) {
          setAuthLoading(false);
          return;
        }
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session?.user) {
            fetchUserProfileAndData(session.user.id, session.user.email);
          } else {
            setAuthLoading(false);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session?.user) {
            fetchUserProfileAndData(session.user.id, session.user.email);
          } else {
            setUserProfile(null);
            setAuthLoading(false);
          }
        });

        return () => subscription.unsubscribe();
      }, [supabase]);

      // プロフィールとDBデータ一式の読み込み（RLSにより許可されたデータのみ返る）
      const fetchUserProfileAndData = async (userId, userEmail) => {
        if (!supabase) return;
        setDbLoading(true);

        const { data: prof } = await supabase
          .from("profiles")
          .select("*")
          .eq("id", userId)
          .single();

        if (prof) {
          setUserProfile(prof);
          setRole(prof.role || "client");
        } else {
          // もしprofilesレコードが未作成なら自動作成を試みる
          const fallback = { id: userId, email: userEmail, full_name: "Re.Start 管理者", role: "admin" };
          await supabase.from("profiles").upsert(fallback);
          setUserProfile(fallback);
          setRole("admin");
        }

        await reloadDatabaseRecords();
        setDbLoading(false);
        setAuthLoading(false);
      };

      const reloadDatabaseRecords = async () => {
        if (!supabase) return;
        const [orgsRes, storesRes, profsRes, assignsRes, membersRes] = await Promise.all([
          supabase.from("organizations").select("*").order("created_at", { ascending: false }),
          supabase.from("stores").select("*").order("created_at", { ascending: false }),
          supabase.from("profiles").select("*").order("created_at", { ascending: false }),
          supabase.from("store_assignments").select("*").order("created_at", { ascending: false }),
          supabase.from("organization_members").select("*").order("created_at", { ascending: false })
        ]);

        const orgList = orgsRes.data || [];
        const stList = storesRes.data || [];
        setDbOrgs(orgList);
        setDbStores(stList);
        setDbProfiles(profsRes.data || []);
        setDbStoreAssigns(assignsRes.data || []);
        setDbOrgMembers(membersRes.data || []);

        if (orgList.length > 0 && !newStoreOrgId) {
          setNewStoreOrgId(orgList[0].id);
        }
      };

      // 監査ログ記録用ヘルパー
      const writeAuditLog = async (action, targetTable, targetId, details = {}) => {
        if (!supabase || !session?.user) return;
        await supabase.from("audit_logs").insert({
          actor_user_id: session.user.id,
          action,
          target_table: targetTable,
          target_record_id: targetId,
          details
        });
      };

      // --- フェーズ5：会社（Organization）の新規登録 ---
      const handleCreateOrganization = async (e) => {
        e.preventDefault();
        if (!supabase || !newOrgName.trim()) return;
        if (role !== "admin") {
          alert("会社の登録は管理者(Admin)のみ可能です。");
          return;
        }

        const { data, error } = await supabase
          .from("organizations")
          .insert({
            name: newOrgName.trim(),
            contact_email: newOrgEmail.trim() || null,
            phone: newOrgPhone.trim() || null,
            status: "active"
          })
          .select()
          .single();

        if (error) {
          alert("会社登録エラー: " + error.message);
          return;
        }

        await writeAuditLog("create_organization", "organizations", data.id, { name: data.name });
        setNewOrgName("");
        setNewOrgEmail("");
        setNewOrgPhone("");
        await reloadDatabaseRecords();
        setNewStoreOrgId(data.id);
        notify(`✅ 会社「${data.name}」をデータベースに登録しました！`);
      };

      // 会社のステータス切り替え（契約中 ⇔ 停止）
      const handleToggleOrgStatus = async (org) => {
        if (!supabase || role !== "admin") return;
        const nextStatus = org.status === "active" ? "suspended" : "active";
        const { error } = await supabase
          .from("organizations")
          .update({ status: nextStatus })
          .eq("id", org.id);

        if (!error) {
          await writeAuditLog("update_organization_status", "organizations", org.id, { status: nextStatus });
          await reloadDatabaseRecords();
          notify(`会社「${org.name}」の状態を ${nextStatus === "active" ? "契約中" : "停止中"} に変更しました。`);
        }
      };

      // --- フェーズ5：店舗（Store）の新規登録 ---
      const handleCreateStore = async (e) => {
        e.preventDefault();
        if (!supabase || !newStoreName.trim() || !newStoreOrgId) {
          alert("所属する会社と店舗名を入力してください（先に「会社管理」で会社を1社登録してください）。");
          return;
        }
        if (role === "client") {
          alert("顧客アカウントからは店舗を追加できません。");
          return;
        }

        const { data, error } = await supabase
          .from("stores")
          .insert({
            organization_id: newStoreOrgId,
            name: newStoreName.trim(),
            prefecture: newStorePref.trim(),
            city: newStoreCity.trim(),
            address: newStoreAddr.trim(),
            phone: newStorePhone.trim() || null,
            profile_strength_score: Number(newStoreScore) || 80
          })
          .select()
          .single();

        if (error) {
          alert("店舗登録エラー: " + error.message);
          return;
        }

        await writeAuditLog("create_store", "stores", data.id, { name: data.name });
        setNewStoreName("");
        setNewStoreAddr("");
        setNewStorePhone("");
        await reloadDatabaseRecords();
        setSelectedStoreId(data.id);
        notify(`🏪 店舗「${data.name}」を登録し、選択中の店舗に切り替えました！`);
      };

      // サンプル会社＆2店舗をワンタップでDBに自動投入する機能
      const handleSeedSampleToDb = async () => {
        if (!supabase || role !== "admin") return;
        const { data: org, error: orgErr } = await supabase
          .from("organizations")
          .insert({
            name: "株式会社東海ウェルネス（DB登録サンプル）",
            contact_email: "contact@tokai-wellness.example.com",
            phone: "058-200-0000",
            status: "active"
          })
          .select()
          .single();

        if (orgErr) {
          alert("サンプル作成エラー: " + orgErr.message);
          return;
        }

        const { data: insertedStores } = await supabase
          .from("stores")
          .insert([
            {
              organization_id: org.id,
              name: "整体サロン Re.Body 岐阜駅前院（DB保存済）",
              prefecture: "岐阜県",
              city: "岐阜市",

          user_id: assignUserId,
          member_role: assignRole

          store_id: assignStoreId,
          user_id: assignUserId,
          assignment_role: assignRole

          return;

                        </div>
                        <div className="bg-navy-800/90 border border-slate-800 rounded-xl p-3">
                          <div className="text-xs text-slate-300">返信済</div>
                          <div className="text-xl font-black text-cyan-400 mt-1">{currentStore.reviews.replied}件</div>
                          <div className="text-[11px] text-rose-400 font-semibold">未返信: {currentStore.reviews.unreplied}件</div>
                        </div>
                      </div>
                    </section>

                    <section className="bg-navy-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                      <h3 className="text-sm sm:text-base font-bold text-white mb-2">GBPパフォーマンス推移</h3>
                      {currentStore.gbpConnected && currentStore.performance.length > 0 ? (
                        <div className="h-36 flex items-end justify-between gap-2 pt-4 px-2 border-b border-slate-800">
                          {currentStore.performance.map((pt, i) => {
                            const val = pt[metricKey];
                            const heightPct = Math.max(12, Math.round((val / maxMetricValue) * 100));
                            return (
                              <div key={i} className="flex-1 flex flex-col items-center gap-1">
                                <span className="text-[10px] text-slate-300 font-bold">{val}</span>
                                <div className="w-full bg-navy-800 rounded-t-lg h-24 flex items-end p-0.5">
                                  <div className={`w-full rounded-t-md ${metricLabels[metricKey].color}`} style={{ height: `${heightPct}%` }} />
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div className="h-36 rounded-xl border border-dashed border-slate-700 flex items-center justify-center text-xs text-amber-300">
                          Google実績指標 未連携
                        </div>
                      )}
                    </section>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
