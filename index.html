            { type: "非指名検索(地域×業態)", badgeColor: "bg-emerald-100 text-emerald-800", word: "金山 スナック", desc: "エリアを絞って確実にお店を探している、来店意欲の高い新規顧客。" }

          { id: "s2", label: "営業時間・特別営業時間", score: 85, color: "bg-cyan-400", note: "通常営業時間設定済" },

        ],
        reviews: {
          avg: 4.6, total: 33, newCount: 3, replied: 28, unreplied: 5, replyRate: 85, positiveRate: 94,
          dist: [
            { star: "★5", pct: 73, count: 24, color: "bg-emerald-400" },
            { star: "★4", pct: 21, count: 7, color: "bg-cyan-400" },
            { star: "★3", pct: 6, count: 2, color: "bg-blue-400" },
            { star: "★2", pct: 0, count: 0, color: "bg-amber-400" },
            { star: "★1", pct: 0, count: 0, color: "bg-rose-500" }
          ]
        },
        performance: [
          { month: "4月", search: 2100, profile: 1280, web: 115, call: 19, route: 42 },
          { month: "5月", search: 2290, profile: 1390, web: 128, call: 22, route: 48 },
          { month: "6月", search: 2410, profile: 1480, web: 136, call: 23, route: 50 },
          { month: "7月", search: 2580, profile: 1590, web: 149, call: 25, route: 55 },
          { month: "8月", search: 2740, profile: 1710, web: 162, call: 28, route: 61 },
          { month: "9月", search: 2917, profile: 1830, web: 176, call: 30, route: 66 }
        ],
        citations: [
          { label: "検索経由表示", value: "2,917回" },
          { label: "マップ経由表示", value: "1,830回" },
          { label: "WEBアクセス", value: "176回" },
          { label: "ルート検索数", value: "66回" },
          { label: "通話数", value: "30回" },
          { label: "NAP統一スコア", value: "92%" }
        ]
      }
    ];

    function mapDbStore(dbStore, orgMap, kws, ranks, revs, posts, perfs) {
      const orgName = orgMap[dbStore.organization_id]?.name || "登録企業";
      const baseScore = Number(dbStore.profile_strength_score) || 86;
      const storeKws = kws.filter(k => k.store_id === dbStore.id);
      const storeRevs = revs.filter(r => r.store_id === dbStore.id);
      const latestRev = storeRevs[0];
      const totalRev = latestRev ? Number(latestRev.total_reviews) : 33;
      const avgRating = latestRev ? Number(latestRev.average_rating) : 4.6;
      const repliedRev = latestRev ? Number(latestRev.replied_count) : 28;
      const unrepliedRev = latestRev ? Number(latestRev.unreplied_count) : 5;
      const storePosts = posts.filter(p => p.store_id === dbStore.id);
      const storePerfs = perfs.filter(p => p.store_id === dbStore.id);
      const latestPerf = storePerfs[storePerfs.length - 1];

      const searchImp = latestPerf ? Number(latestPerf.search_views) : 2917;
      const mapImp = latestPerf ? Number(latestPerf.profile_views) : 1830;
      const webClicks = latestPerf ? Number(latestPerf.website_clicks) : 176;
      const dirReq = latestPerf ? Number(latestPerf.direction_requests) : 66;
      const callClk = latestPerf ? Number(latestPerf.call_clicks) : 30;
      const monthLabel = latestPerf ? latestPerf.target_month : "2026年9月度";

      return {
        id: dbStore.id, isDemo: false, organization_id: dbStore.organization_id,
        companyName: orgName, storeName: dbStore.name,
        address: `${dbStore.prefecture || ""}${dbStore.city || ""}${dbStore.address || ""}` || "住所未設定",
        gbpConnected: true, mapConnected: true, profileStrengthScore: baseScore,
        lastSync: "Supabase DB連動中",
        gbpMetrics: {
          targetMonthLabel: monthLabel, searchImpressions: searchImp, mapImpressions: mapImp,
          websiteClicks: webClicks, directionRequests: dirReq, callClicks: callClk,
          monthlyPostCount: storePosts.length, monthlyPhotoAdded: storePosts.length * 2,
          searchKeywords: [
            { type: "指名検索", badgeColor: "bg-blue-100 text-blue-700", word: storeKws[0]?.keyword || dbStore.name, desc: "既に店舗を知っている顕在顧客。リピーターや口コミ・紹介経由。" },
            { type: "非指名検索(業態)", badgeColor: "bg-amber-100 text-amber-800", word: storeKws[1]?.keyword || "スナック", desc: "近隣で店舗を探している新規の潜在顧客。" },
            { type: "非指名検索(地域×業態)", badgeColor: "bg-emerald-100 text-emerald-800", word: storeKws[2]?.keyword || `${dbStore.city || "金山"} スナック`, desc: "エリアを絞って確実にお店を探している、来店意欲の高い新規顧客。" }
          ]
        },
        keywords: storeKws.length > 0 ? storeKws.map(k => {
          const r = ranks.find(rk => rk.keyword_id === k.id);
          const pos = r && r.rank_position ? Number(r.rank_position) : 2;
          return {
            id: k.id, word: k.keyword, date: r ? r.measured_date : "計測済", avgRank: pos, prevRank: pos + 1,
            pins: [
              { id: 1, area: "店舗中心", top: "48%", left: "48%", rank: Math.round(pos) },
              { id: 2, area: "北エリア", top: "30%", left: "52%", rank: Math.round(pos) + 1 },
              { id: 3, area: "南エリア", top: "66%", left: "44%", rank: Math.round(pos) }
            ]
          };
        }) : DEMO_STORES[0].keywords,
        profileScores: DEMO_STORES[0].profileScores,
        tasks: DEMO_STORES[0].tasks,
        reviews: {
          avg: avgRating, total: totalRev, newCount: 3, replied: repliedRev, unreplied: unrepliedRev,
          replyRate: totalRev > 0 ? Math.round((repliedRev / totalRev) * 100) : 85, positiveRate: 92,
          dist: DEMO_STORES[0].reviews.dist
        },
        performance: storePerfs.length > 0 ? storePerfs.map(p => ({
          month: p.target_month, search: Number(p.search_views), profile: Number(p.profile_views),
          web: Number(p.website_clicks), call: Number(p.call_clicks), route: Number(p.direction_requests)
        })) : DEMO_STORES[0].performance,
        citations: [
          { label: "データ種別", value: "Supabase DB" },
          { label: "検索経由表示", value: `${searchImp.toLocaleString()}回` },
          { label: "マップ経由表示", value: `${mapImp.toLocaleString()}回` },
          { label: "WEBアクセス", value: `${webClicks.toLocaleString()}回` },
          { label: "ルート / 通話", value: `${dirReq} / ${callClk}回` }
        ]
      };
    }

    function App() {
      const [sbUrl, setSbUrl] = useState(() => localStorage.getItem("restart_sb_url") || "");
      const [sbKey, setSbKey] = useState(() => localStorage.getItem("restart_sb_key") || "");
      const [showConfig, setShowConfig] = useState(false);

      const supabase = useMemo(() => {
        if (!sbUrl || !sbKey) return null;
        try { return window.supabase.createClient(sbUrl.trim(), sbKey.trim()); } catch (e) { return null; }
      }, [sbUrl, sbKey]);

      const [session, setSession] = useState(null);
      const [demoBypass, setDemoBypass] = useState(false);
      const [authMode, setAuthMode] = useState("login");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [authMsg, setAuthMsg] = useState("");

      const [role, setRole] = useState("admin");
      const [activeMenu, setActiveMenu] = useState("dashboard");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedStoreId, setSelectedStoreId] = useState("demo-iroha");
      const [selectedKwIndex, setSelectedKwIndex] = useState(0);
      const [metricKey, setMetricKey] = useState("search");
      const [demoStoreList, setDemoStoreList] = useState(DEMO_STORES);
      const [notice, setNotice] = useState("");

      // DBデータ
      const [dbOrgs, setDbOrgs] = useState([]);
      const [dbStores, setDbStores] = useState([]);
      const [dbKeywords, setDbKeywords] = useState([]);
      const [dbRanks, setDbRanks] = useState([]);
      const [dbReviews, setDbReviews] = useState([]);
      const [dbPosts, setDbPosts] = useState([]);
      const [dbPerf, setDbPerf] = useState([]);
      const [dbProfiles, setDbProfiles] = useState([]);
      const [dbAssigns, setDbAssigns] = useState([]);
      const [dbSyncJobs, setDbSyncJobs] = useState([]);
      const [dbAuditLogs, setDbAuditLogs] = useState([]);

      // フォームステート
      const [newOrgName, setNewOrgName] = useState("");
      const [newOrgEmail, setNewOrgEmail] = useState("");
      const [newOrgPhone, setNewOrgPhone] = useState("");
      const [newStoreOrgId, setNewStoreOrgId] = useState("");
      const [newStoreName, setNewStoreName] = useState("");
      const [newStoreCity, setNewStoreCity] = useState("名古屋市");
      const [targetStoreId, setTargetStoreId] = useState("");
      const [newKwText, setNewKwText] = useState("");
      const [selectedKwIdForRank, setSelectedKwIdForRank] = useState("");
      const [newRankPos, setNewRankPos] = useState("2");
      const [newRankDate, setNewRankDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [revAvg, setRevAvg] = useState("4.6");
      const [revTotal, setRevTotal] = useState("33");
      const [revReplied, setRevReplied] = useState("28");
      const [revUnreplied, setRevUnreplied] = useState("5");
      const [perfMonth, setPerfMonth] = useState("2026年9月度");
      const [perfSearch, setPerfSearch] = useState("2917");
      const [perfMap, setPerfMap] = useState("1830");
      const [perfWeb, setPerfWeb] = useState("176");
      const [perfRoute, setPerfRoute] = useState("66");
      const [perfCall, setPerfCall] = useState("30");
      const [postTitle, setPostTitle] = useState("");
      const [postContent, setPostContent] = useState("");
      const [postType, setPostType] = useState("whats_new");
      const [csvText, setCsvText] = useState("");
      const [csvResult, setCsvResult] = useState(null);

      // ユーザー追加用新規ステート
      const [newUserEmail, setNewUserEmail] = useState("");
      const [newUserPassword, setNewUserPassword] = useState("");
      const [newUserName, setNewUserName] = useState("");
      const [newUserRole, setNewUserRole] = useState("staff");

      const [assignUserId, setAssignUserId] = useState("");
      const [assignStoreId, setAssignStoreId] = useState("");
      const [assignRole, setAssignRole] = useState("client");
      const [gbpClientId, setGbpClientId] = useState(() => localStorage.getItem("restart_gbp_client_id") || "");
      const [gbpLocId, setGbpLocId] = useState("locations/1029384756");
      const [secReport, setSecReport] = useState(null);
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      // レポート考察文
      const [repMonth, setRepMonth] = useState("2026年9月度");
      const [insightSearch, setInsightSearch] = useState("");
      const [insightReview, setInsightReview] = useState("");
      const [nextAct1, setNextAct1] = useState("");
      const [nextAct2, setNextAct2] = useState("");
      const [nextAct3, setNextAct3] = useState("");
      const [showEditor, setShowEditor] = useState(false);

      const notify = (m) => { setNotice(m); setTimeout(() => setNotice(""), 4000); };

      const writeAudit = async (action, table, targetId = null) => {
        if (!supabase || !session?.user) return;
        try { await supabase.from("audit_logs").insert({ actor_user_id: session.user.id, action, target_table: table, target_record_id: targetId }); } catch (e) {}
      };

      useEffect(() => {
        if (!supabase) return;
        supabase.auth.getSession().then(({ data }) => {
          if (data?.session) { setSession(data.session); refreshDb(); }
        });
        const { data: sub } = supabase.auth.onAuthStateChange((_ev, s) => {
          setSession(s);
          if (s) refreshDb();
        });
        return () => sub?.subscription?.unsubscribe();
      }, [supabase]);

      const refreshDb = async () => {
        if (!supabase) return;
        const [orgs, stores, kws, ranks, revs, posts, perfs, profs, assigns, syncs, audits] = await Promise.all([
          supabase.from("organizations").select("*").order("created_at", { ascending: false }),
          supabase.from("stores").select("*").order("created_at", { ascending: false }),
          supabase.from("keywords").select("*").order("created_at", { ascending: false }),
          supabase.from("rank_measurements").select("*").order("measured_date", { ascending: false }),
          supabase.from("review_snapshots").select("*").order("snapshot_date", { ascending: false }),
          supabase.from("post_records").select("*").order("posted_at", { ascending: false }),
          supabase.from("performance_snapshots").select("*").order("created_at", { ascending: true }),
          supabase.from("profiles").select("*").order("created_at", { ascending: false }),
          supabase.from("store_assignments").select("*"),
          supabase.from("sync_jobs").select("*").order("executed_at", { ascending: false }).limit(10),
          supabase.from("audit_logs").select("*").order("created_at", { ascending: false }).limit(20)
        ]);
        setDbOrgs(orgs.data || []);
        setDbStores(stores.data || []);
        setDbKeywords(kws.data || []);
        setDbRanks(ranks.data || []);
        setDbReviews(revs.data || []);
        setDbPosts(posts.data || []);
        setDbPerf(perfs.data || []);
        setDbProfiles(profs.data || []);
        setDbAssigns(assigns.data || []);
        setDbSyncJobs(syncs.data || []);
        setDbAuditLogs(audits.data || []);
        if (orgs.data?.length && !newStoreOrgId) setNewStoreOrgId(orgs.data[0].id);
        if (stores.data?.length && !targetStoreId) setTargetStoreId(stores.data[0].id);
        if (kws.data?.length && !selectedKwIdForRank) setSelectedKwIdForRank(kws.data[0].id);
      };

      const allStores = useMemo(() => {
        const orgMap = {};
        dbOrgs.forEach(o => { orgMap[o.id] = o; });
        const real = dbStores.map(s => mapDbStore(s, orgMap, dbKeywords, dbRanks, dbReviews, dbPosts, dbPerf));
        return [...real, ...demoStoreList];
      }, [dbStores, dbOrgs, dbKeywords, dbRanks, dbReviews, dbPosts, dbPerf, demoStoreList]);

      const currentStore = useMemo(() => {
        return allStores.find(s => s.id === selectedStoreId) || allStores[0] || DEMO_STORES[0];
      }, [allStores, selectedStoreId]);

      const currentKeyword = currentStore.keywords[selectedKwIndex] || currentStore.keywords[0];
      const visibleMenus = MENU_ITEMS.filter(m => m.roles.includes(role));
      const mData = currentStore.gbpMetrics;

      useEffect(() => {
        setRepMonth(mData.targetMonthLabel || "2026年9月度");
        setInsightSearch(`今月は検索経由での表示が${mData.searchImpressions.toLocaleString()}回と非常に好調でした。キーワード分析からもわかる通り、「${mData.searchKeywords[0]?.word || currentStore.storeName}」「${mData.searchKeywords[2]?.word || "地域×業態"}」といった顕在層（すでに目的や店舗を絞っているユーザー）からのアプローチが多いのが特徴です。ウェブサイトへのアクセス数（${mData.websiteClicks.toLocaleString()}回）もしっかりと獲得できており、認知から興味関心への移行は成功しています。`);
        setInsightReview(`平均評価${currentStore.reviews.avg}、累計${currentStore.reviews.total}件という素晴らしい実績を維持されています。「接客が良い」「〇〇が美味し」といった高評価の定性的なクチコミが多く寄せられており、これが新規ユーザーへの強力な来店動機（ソーシャルプルーフ）として機能しています。`);
        setNextAct1(`今月は投稿・写真追加が${mData.monthlyPostCount}件でした。マップ露出を底上げするためには、定期的な情報発信が不可欠です。おすすめドリンクや店内の雰囲気などの写真を添えた「最新情報の投稿」を月2〜4回実施することを推奨します。`);
        setNextAct2(`ルート検索に対して通話数がやや控えめです。迷っている層の背中を押すため、初回限定のクーポンや、わかりやすい料金体系を明記し、直接予約へのハードルを下げる施策が有効です。`);
        setNextAct3(`寄せられている高評価口コミに対し、店舗から丁寧な返信を行うことでリピーターのロイヤリティを高めます。温かいコミュニケーションを見せることで、新規ユーザーの安心感にも直結します。`);
      }, [currentStore]);

      // PDF出力
      const handleDownloadPdf = async () => {
        if (!window.html2canvas || !window.jspdf) { window.print(); return; }
        setIsGeneratingPdf(true);

                            <div className="border border-slate-200 border-l-4 border-l-blue-600 rounded-xl p-5 space-y-2"><h3 className="text-base font-black text-slate-900">通話数</h3><p className="text-xs text-slate-600 leading-relaxed">電話ボタンをタップして発信した回数。空席確認や予約など、直接的なコンバージョン（売上）に繋がるアクションです。</p></div>
                          </div>
                        </div>
                        <div className="px-8 py-3 bg-slate-50 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>MEO Performance Report - {currentStore.storeName} 様</span><span>Page 1 of 4</span></div>
                      </div>

                      {/* Page 2 */}
                      <div id="pdf-page-2" style={{ width: "1040px", height: "735px" }} className="pdf-page bg-white text-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-300 flex flex-col justify-between">
                        <div className="bg-[#0F172A] text-white px-8 py-5 flex items-center justify-between border-b-4 border-blue-600">
                          <div><div className="text-xs font-black text-blue-400">RE.START MEO CONSULTING</div><h2 className="text-3xl font-black mt-0.5">Performance Data</h2></div>
                          <div className="text-sm font-bold text-slate-300">{repMonth}</div>
                        </div>
                        <div className="px-8 py-6 flex-1 flex flex-col justify-between">
                          <div className="flex items-center gap-2.5"><span className="w-1.5 h-6 bg-blue-600 rounded-full"></span><h3 className="text-lg font-black text-slate-900">Section 2: 月次パフォーマンスデータ</h3></div>
                          <div className="grid grid-cols-2 gap-6">
                            <div className="bg-slate-50 border border-slate-200 border-t-4 border-t-blue-500 rounded-xl p-5 text-center"><div className="text-xs font-bold text-slate-500">口コミ件数</div><div className="text-4xl font-black text-blue-600 mt-1">{currentStore.reviews.total}<span className="text-base font-bold text-slate-500 ml-1">件</span></div></div>
                            <div className="bg-slate-50 border border-slate-200 border-t-4 border-t-amber-400 rounded-xl p-5 text-center"><div className="text-xs font-bold text-slate-500">平均評価</div><div className="text-4xl font-black text-amber-500 mt-1">{currentStore.reviews.avg} <span className="text-xl">★★★★★</span></div></div>
                          </div>
                          <div className="border border-slate-200 rounded-xl p-5 space-y-3">
                            <div className="flex justify-between items-center"><h4 className="text-sm font-black text-slate-800">① 認知指標 (Discovery)</h4><span className="text-xs font-bold text-slate-500">検索経由: {mData.searchImpressions.toLocaleString()}回 / マップ経由: {mData.mapImpressions.toLocaleString()}回</span></div>
                            <div className="w-full h-10 rounded-lg overflow-hidden flex text-white text-xs font-bold">
                              <div style={{ width: `${searchPct}%` }} className="bg-blue-600 flex items-center justify-center">検索経由 ({mData.searchImpressions.toLocaleString()})</div>
                              <div style={{ width: `${mapPct}%` }} className="bg-emerald-500 flex items-center justify-center">マップ経由 ({mData.mapImpressions.toLocaleString()})</div>
                            </div>
                          </div>
                          <div className="border border-slate-200 rounded-xl p-5">
                            <h4 className="text-sm font-black text-slate-800 mb-3">② コンバージョン指標 (Conversion)</h4>
                            <div className="grid grid-cols-12 gap-6 items-center">
                              <div className="col-span-8 space-y-3">
                                <div><div className="flex justify-between text-xs font-bold mb-1"><span>WEBアクセス</span><span className="text-blue-600 font-black">{mData.websiteClicks} 回</span></div><div className="w-full h-3 bg-slate-100 rounded-full"><div className="h-full bg-blue-600 rounded-full" style={{ width: `${Math.round((mData.websiteClicks / maxConv) * 100)}%` }} /></div></div>
                                <div><div className="flex justify-between text-xs font-bold mb-1"><span>ルート検索</span><span className="text-emerald-600 font-black">{mData.directionRequests} 回</span></div><div className="w-full h-3 bg-slate-100 rounded-full"><div className="h-full bg-emerald-500 rounded-full" style={{ width: `${Math.round((mData.directionRequests / maxConv) * 100)}%` }} /></div></div>
                                <div><div className="flex justify-between text-xs font-bold mb-1"><span>通話数</span><span className="text-amber-600 font-black">{mData.callClicks} 回</span></div><div className="w-full h-3 bg-slate-100 rounded-full"><div className="h-full bg-amber-500 rounded-full" style={{ width: `${Math.round((mData.callClicks / maxConv) * 100)}%` }} /></div></div>
                              </div>
                              <div className="col-span-4 bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs text-slate-600 leading-relaxed">検索経由の露出（{mData.searchImpressions.toLocaleString()}回）からWEBアクセスへ良好に遷移しています。</div>
                            </div>
                          </div>
                        </div>
                        <div className="px-8 py-3 bg-slate-50 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>MEO Performance Report - {currentStore.storeName} 様</span><span>Page 2 of 4</span></div>
                      </div>

                      {/* Page 3 */}
                      <div id="pdf-page-3" style={{ width: "1040px", height: "735px" }} className="pdf-page bg-white text-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-300 flex flex-col justify-between">
                        <div className="bg-[#0F172A] text-white px-8 py-5 flex items-center justify-between border-b-4 border-blue-600">
                          <div><div className="text-xs font-black text-blue-400">RE.START MEO CONSULTING</div><h2 className="text-3xl font-black mt-0.5">Keywords & Action Log</h2></div>
                          <div className="text-sm font-bold text-slate-300">{repMonth}</div>
                        </div>
                        <div className="px-8 py-6 flex-1 flex flex-col justify-between space-y-5">
                          <div className="flex items-center gap-2.5"><span className="w-1.5 h-6 bg-blue-600 rounded-full"></span><h3 className="text-lg font-black text-slate-900">Section 3: 検索キーワード分析 & 今月の施策ログ</h3></div>
                          <div className="grid grid-cols-2 gap-6 flex-1">
                            <div className="border border-slate-200 rounded-xl p-5 space-y-3">
                              <h4 className="text-base font-black text-blue-900">ユーザー上位検索キーワード</h4>
                              <table className="w-full text-xs border-collapse mt-3">
                                <thead><tr className="bg-slate-100 text-slate-600 border-b border-slate-200"><th className="p-3 text-left">タイプ</th><th className="p-3 text-left">キーワード</th><th className="p-3 text-left">傾向</th></tr></thead>
                                <tbody className="divide-y divide-slate-200">
                                  {mData.searchKeywords.map((kw, i) => (
                                    <tr key={i}><td className="p-3"><span className={`text-[10px] font-bold px-2 py-1 rounded ${kw.badgeColor}`}>{kw.type}</span></td><td className="p-3 font-black text-slate-900">{kw.word}</td><td className="p-3 text-slate-600">{kw.desc}</td></tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                            <div className="border border-slate-200 rounded-xl p-5 space-y-3">
                              <h4 className="text-base font-black text-blue-900">今月の運用施策ログ (稼働実績)</h4>
                              <table className="w-full text-xs border-collapse mt-3">
                                <thead><tr className="bg-slate-100 text-slate-600 border-b border-slate-200"><th className="p-3 text-left">施策項目</th><th className="p-3 text-center">件数</th><th className="p-3 text-left">ステータス</th></tr></thead>
                                <tbody className="divide-y divide-slate-200">
                                  <tr><td className="p-3 font-bold">最新情報の投稿</td><td className="p-3 text-center font-black">{mData.monthlyPostCount}件</td><td className="p-3 text-slate-600">定期的な発信が推奨されます。</td></tr>
                                  <tr><td className="p-3 font-bold">写真の追加・更新</td><td className="p-3 text-center font-black">{mData.monthlyPhotoAdded}枚</td><td className="p-3 text-slate-600">視覚的訴求力の維持。</td></tr>
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                        <div className="px-8 py-3 bg-slate-50 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>MEO Performance Report - {currentStore.storeName} 様</span><span>Page 3 of 4</span></div>
                      </div>

                      {/* Page 4 */}
                      <div id="pdf-page-4" style={{ width: "1040px", height: "735px" }} className="pdf-page bg-white text-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-300 flex flex-col justify-between">
                        <div className="bg-[#0F172A] text-white px-8 py-5 flex items-center justify-between border-b-4 border-blue-600">
                          <div><div className="text-xs font-black text-blue-400">RE.START MEO CONSULTING</div><h2 className="text-3xl font-black mt-0.5">Insights & Next Action</h2></div>
                          <div className="text-sm font-bold text-slate-300">{repMonth}</div>
                        </div>
                        <div className="px-8 py-6 flex-1 flex flex-col justify-between">
                          <div className="flex items-center gap-2.5"><span className="w-1.5 h-6 bg-blue-600 rounded-full"></span><h3 className="text-lg font-black text-slate-900">Section 4: プロの考察 & Next Action</h3></div>
                          <div className="bg-blue-50/40 border-2 border-blue-500 rounded-xl p-5 space-y-3">
                            <h4 className="text-sm font-black text-blue-700 border-b border-blue-200 pb-2">今月の総括・プロの考察</h4>
                            <div className="grid grid-cols-2 gap-6 text-xs leading-relaxed text-slate-700">
                              <div><div className="font-black text-slate-900 mb-1">■ 検索指標の傾向</div><p>{insightSearch}</p></div>
                              <div><div className="font-black text-slate-900 mb-1">■ 口コミの定性分析</div><p>{insightReview}</p></div>
                            </div>
                          </div>
                          <div className="space-y-3">
                            <h4 className="text-sm font-black text-slate-900">次月へ向けた戦略提案 (Next Action)</h4>
                            <div className="grid grid-cols-3 gap-5">
                              <div className="border border-slate-200 border-t-4 border-t-amber-500 rounded-xl p-4 space-y-2"><h5 className="text-sm font-black text-slate-900">1. アクティブ感の演出</h5><p className="text-xs text-slate-600 leading-relaxed">{nextAct1}</p></div>
                              <div className="border border-slate-200 border-t-4 border-t-amber-500 rounded-xl p-4 space-y-2"><h5 className="text-sm font-black text-slate-900">2. CV導線強化</h5><p className="text-xs text-slate-600 leading-relaxed">{nextAct2}</p></div>
                              <div className="border border-slate-200 border-t-4 border-t-amber-500 rounded-xl p-4 space-y-2"><h5 className="text-sm font-black text-slate-900">3. 口コミ返信によるファン化</h5><p className="text-xs text-slate-600 leading-relaxed">{nextAct3}</p></div>
                            </div>
                          </div>
                        </div>
                        <div className="px-8 py-3 bg-slate-50 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>MEO Performance Report - {currentStore.storeName} 様</span><span>Page 4 of 4</span></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ⑩ ユーザー・権限管理（新規ユーザー追加機能付き完全独立ページ） */}
              {activeMenu === "users" && (
                <div className="space-y-6">
                  <form onSubmit={handleCreateNewUser} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">👥 新規ユーザーの追加・招待（従業員・顧客アカウント発行）</h2>
                    <p className="text-slate-400">新しいスタッフやクライアント企業のご担当者様用のアカウントをSupabaseに作成します。</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div><label className="block text-slate-300 mb-1 font-bold">お名前（表示名）*</label><input type="text" required placeholder="例: 佐藤 花子" value={newUserName} onChange={e => setNewUserName(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" /></div>
                      <div>
                        <label className="block text-slate-300 mb-1 font-bold">権限種別 (ロール) *</label>
                        <select value={newUserRole} onChange={e => setNewUserRole(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white font-bold">
                          <option value="staff">従業員 (Staff)</option>
                          <option value="client">顧客 (Client：自社店舗閲覧のみ)</option>
                          <option value="admin">管理者 (Admin)</option>
                        </select>
                      </div>
                      <div><label className="block text-slate-300 mb-1 font-bold">メールアドレス *</label><input type="email" required placeholder="user@example.com" value={newUserEmail} onChange={e => setNewUserEmail(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" /></div>
                      <div><label className="block text-slate-300 mb-1 font-bold">パスワード（6文字以上） *</label><input type="password" required minLength={6} placeholder="••••••••" value={newUserPassword} onChange={e => setNewUserPassword(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" /></div>
                    </div>
                    <button type="submit" className="bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold px-5 py-3 rounded-xl shadow-lg">✨ 新規ユーザーアカウントを追加する</button>
                  </form>

                  <form onSubmit={handleAssignStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">🔗 ユーザーへの店舗アクセス権割り当て</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <select required value={assignUserId} onChange={e => setAssignUserId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- ユーザーを選択 --</option>
                        {dbProfiles.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.email})</option>)}
                      </select>
                      <select required value={assignStoreId} onChange={e => setAssignStoreId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                      <select value={assignRole} onChange={e => setAssignRole(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="client">顧客として閲覧のみ許可</option>
                        <option value="staff">担当スタッフとして編集許可</option>
                      </select>
                    </div>
                    <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">割り当てを保存</button>
                  </form>
                </div>
              )}

              {/* その他の専用ページ（rankings, keywords, reviews, posts, csv, settings） */}
              {["rankings", "keywords", "reviews", "posts", "csv", "settings"].includes(activeMenu) && (
                <div className="bg-navy-900 border border-slate-800 rounded-2xl p-6 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">
                    {MENU_ITEMS.find(m => m.key === activeMenu)?.icon} {MENU_ITEMS.find(m => m.key === activeMenu)?.label} 専用ページ
                  </h2>
                  <p className="text-slate-300">現在の店舗: <strong>{currentStore.storeName}</strong></p>
                  <div className="flex gap-3 pt-2">
                    <button onClick={() => setActiveMenu("dashboard")} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl">ダッシュボードを開く</button>
                    <button onClick={() => setActiveMenu("reports")} className="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl">4枚組レポートを開く</button>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
