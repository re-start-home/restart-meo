    function buildStoreView(dbStore, orgMap, kws, ranks, revs, posts, perfs) {
      const storeKws = kws.filter(k => k.store_id === dbStore.id);
      const latestRev = revs.find(r => r.store_id === dbStore.id);
      const totalRev = latestRev ? Number(latestRev.total_reviews) : 33;
      const avgRating = latestRev ? Number(latestRev.average_rating) : 4.6;
      const repliedRev = latestRev ? Number(latestRev.replied_count) : 28;
      const unrepliedRev = latestRev ? Number(latestRev.unreplied_count) : 5;
      const storePosts = posts.filter(p => p.store_id === dbStore.id);
      const storePerfs = perfs.filter(p => p.store_id === dbStore.id);
      const lp = storePerfs[storePerfs.length - 1];

      const sImp = lp ? Number(lp.search_views) : 2917;
      const mImp = lp ? Number(lp.profile_views) : 1830;
      const wClk = lp ? Number(lp.website_clicks) : 176;
      const dReq = lp ? Number(lp.direction_requests) : 66;
      const cClk = lp ? Number(lp.call_clicks) : 30;
      const fullAddr = `${dbStore.prefecture || ""}${dbStore.city || ""}${dbStore.address || ""}` || dbStore.name;

      return {
        ...BASE_DEMO,
        id: dbStore.id, isDemo: false, organization_id: dbStore.organization_id,
        companyName: orgMap[dbStore.organization_id]?.name || "登録企業",
        storeName: dbStore.name,
        prefecture: dbStore.prefecture || "",
        city: dbStore.city || "",
        address: fullAddr,
        gbpLocationId: dbStore.gbp_location_id || "",
        gbpConnected: !!dbStore.gbp_connected,
        mapConnected: !!dbStore.map_connected,
        lastSync: dbStore.last_synced_at ? new Date(dbStore.last_synced_at).toLocaleString("ja-JP") : "Supabase DB連動中",
        gbpMetrics: {
          targetMonthLabel: lp ? lp.target_month : "2026年9月度",
          searchImpressions: sImp, mapImpressions: mImp, websiteClicks: wClk, directionRequests: dReq, callClicks: cClk,
          monthlyPostCount: storePosts.length, monthlyPhotoAdded: storePosts.length * 2,
          searchKeywords: [
            { type: "指名検索", badgeColor: "bg-blue-100 text-blue-700", word: storeKws[0]?.keyword || dbStore.name, desc: "既に店舗を知っている顕在顧客。リピーターや口コミ・紹介経由。" },
            { type: "非指名検索(業態)", badgeColor: "bg-amber-100 text-amber-800", word: storeKws[1]?.keyword || "スナック", desc: "近隣で店舗を探している新規の潜在顧客。" },
            { type: "非指名検索(地域×業態)", badgeColor: "bg-emerald-100 text-emerald-800", word: storeKws[2]?.keyword || `${dbStore.city || "金山"} スナック`, desc: "エリアを絞って確実にお店を探している、来店意欲の高い新規顧客。" }
          ]
        },
        keywords: storeKws.length > 0 ? storeKws.map(k => {
          const r = ranks.find(rk => rk.keyword_id === k.id);
          const pos = r && r.rank_position ? Number(r.rank_position) : 2;
          return {
            id: k.id, word: k.keyword, date: r ? r.measured_date : "計測済", avgRank: pos, prevRank: pos + 1,
            pins: [
              { id: 1, area: "店舗中心", top: "48%", left: "48%", rank: Math.round(pos) },
              { id: 2, area: "北エリア(500m)", top: "28%", left: "52%", rank: Math.round(pos) + 1 },
              { id: 3, area: "南エリア(500m)", top: "68%", left: "44%", rank: Math.round(pos) },
              { id: 4, area: "東エリア(500m)", top: "44%", left: "68%", rank: Math.round(pos) + 1 },
              { id: 5, area: "西エリア(500m)", top: "52%", left: "28%", rank: Math.round(pos) + 2 }
            ]
          };
        }) : BASE_DEMO.keywords,
        reviews: {
          ...BASE_DEMO.reviews, avg: avgRating, total: totalRev, replied: repliedRev, unreplied: unrepliedRev,
          replyRate: totalRev > 0 ? Math.round((repliedRev / totalRev) * 100) : 85
        },
        performance: storePerfs.length > 0 ? storePerfs.map(p => ({
          month: p.target_month, search: Number(p.search_views), profile: Number(p.profile_views),
          web: Number(p.website_clicks), call: Number(p.call_clicks), route: Number(p.direction_requests)
        })) : BASE_DEMO.performance,
        citations: [
          { label: "GBP連結状態", value: dbStore.gbp_connected ? "🟢 連結済" : "⚪ 未連結" },
          { label: "GoogleMap連結", value: dbStore.map_connected ? "🟢 連結済" : "⚪ 未連結" },
          { label: "検索経由表示", value: `${sImp.toLocaleString()}回` },
          { label: "マップ経由表示", value: `${mImp.toLocaleString()}回` },
          { label: "WEB / ルート / 通話", value: `${wClk} / ${dReq} / ${cClk}回` }
        ]
      };
    }

    function App() {
      const [sbUrl, setSbUrl] = useState(() => localStorage.getItem("restart_sb_url") || "");
      const [sbKey, setSbKey] = useState(() => localStorage.getItem("restart_sb_key") || "");
      const [showConfig, setShowConfig] = useState(false);

      const supabase = useMemo(() => {
        if (!sbUrl || !sbKey) return null;
        try { return window.supabase.createClient(sbUrl.trim(), sbKey.trim()); } catch (e) { return null; }
      }, [sbUrl, sbKey]);

      const [session, setSession] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [authMode, setAuthMode] = useState("login");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [authMsg, setAuthMsg] = useState("");

      // 権限はDBのprofiles.roleのみから決定（手動切り替えボタンは廃止）
      const role = userProfile?.role || "client";
      const roleLabel = role === "admin" ? "管理者 (ADMIN)" : role === "staff" ? "従業員 (STAFF)" : "顧客 (CLIENT)";

      const [activeMenu, setActiveMenu] = useState("dashboard");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedStoreId, setSelectedStoreId] = useState("demo-iroha");
      const [selectedKwIndex, setSelectedKwIndex] = useState(0);
      const [metricKey, setMetricKey] = useState("search");
      const [mapViewMode, setMapViewMode] = useState("pins"); // pins (マップ+順位ピン) | interactive (Googleマップ直接操作)
      const [notice, setNotice] = useState("");

      const [dbOrgs, setDbOrgs] = useState([]);
      const [dbStores, setDbStores] = useState([]);
      const [dbKeywords, setDbKeywords] = useState([]);
      const [dbRanks, setDbRanks] = useState([]);
      const [dbReviews, setDbReviews] = useState([]);
      const [dbPosts, setDbPosts] = useState([]);
      const [dbPerf, setDbPerf] = useState([]);
      const [dbProfiles, setDbProfiles] = useState([]);
      const [dbAssigns, setDbAssigns] = useState([]);
      const [dbAuditLogs, setDbAuditLogs] = useState([]);

      // フォーム入力ステート
      const [newOrgName, setNewOrgName] = useState("");
      const [newOrgEmail, setNewOrgEmail] = useState("");
      const [newOrgPhone, setNewOrgPhone] = useState("");
      const [newStoreOrgId, setNewStoreOrgId] = useState("");
      const [newStoreName, setNewStoreName] = useState("");
      const [newStorePref, setNewStorePref] = useState("愛知県");
      const [newStoreCity, setNewStoreCity] = useState("名古屋市");
      const [newStoreAddr, setNewStoreAddr] = useState("");
      const [newStoreGbpId, setNewStoreGbpId] = useState("");
      const [targetStoreId, setTargetStoreId] = useState("");
      const [newKwText, setNewKwText] = useState("");
      const [selectedKwIdForRank, setSelectedKwIdForRank] = useState("");
      const [newRankPos, setNewRankPos] = useState("2");
      const [newRankDate, setNewRankDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [revAvg, setRevAvg] = useState("4.6");
      const [revTotal, setRevTotal] = useState("33");
      const [revReplied, setRevReplied] = useState("28");
      const [revUnreplied, setRevUnreplied] = useState("5");
      const [perfMonth, setPerfMonth] = useState("2026年9月度");
      const [perfSearch, setPerfSearch] = useState("2917");
      const [perfMap, setPerfMap] = useState("1830");
      const [perfWeb, setPerfWeb] = useState("176");
      const [perfRoute, setPerfRoute] = useState("66");
      const [perfCall, setPerfCall] = useState("30");
      const [postTitle, setPostTitle] = useState("");
      const [postContent, setPostContent] = useState("");
      const [postType, setPostType] = useState("whats_new");
      const [csvText, setCsvText] = useState("");
      const [csvResult, setCsvResult] = useState(null);
      const [newUserEmail, setNewUserEmail] = useState("");
      const [newUserPassword, setNewUserPassword] = useState("");
      const [newUserName, setNewUserName] = useState("");
      const [newUserRole, setNewUserRole] = useState("staff");
      const [assignUserId, setAssignUserId] = useState("");
      const [assignStoreId, setAssignStoreId] = useState("");
      const [assignRole, setAssignRole] = useState("client");

      // GBP & Google Map 連結用ステート
      const [gbpClientId, setGbpClientId] = useState(() => localStorage.getItem("restart_gbp_client_id") || "");
      const [gbpLocationsList, setGbpLocationsList] = useState([]);
      const [linkStoreId, setLinkStoreId] = useState("");
      const [linkGbpLocId, setLinkGbpLocId] = useState("");
      const [linkMapAddress, setLinkMapAddress] = useState("");
      const [secReport, setSecReport] = useState(null);
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      const [repMonth, setRepMonth] = useState("2026年9月度");
      const [insightSearch, setInsightSearch] = useState("");
      const [insightReview, setInsightReview] = useState("");
      const [nextAct1, setNextAct1] = useState("");
      const [nextAct2, setNextAct2] = useState("");
      const [nextAct3, setNextAct3] = useState("");
      const [showEditor, setShowEditor] = useState(false);

      const notify = (m) => { setNotice(m); setTimeout(() => setNotice(""), 4500); };
      const writeAudit = async (action, table, targetId = null) => {
        if (!supabase || !session?.user) return;
        try { await supabase.from("audit_logs").insert({ actor_user_id: session.user.id, action, target_table: table, target_record_id: targetId }); } catch (e) {}
      };

      useEffect(() => {
        if (!supabase) return;
        supabase.auth.getSession().then(({ data }) => {
          if (data?.session) { setSession(data.session); refreshDb(data.session.user); }
        });
        const { data: sub } = supabase.auth.onAuthStateChange((_ev, s) => {
          setSession(s);
          if (s?.user) refreshDb(s.user);
          else setUserProfile(null);
        });
        return () => sub?.subscription?.unsubscribe();
      }, [supabase]);

      const refreshDb = async (userObj = null) => {
        if (!supabase) return;
        const activeUser = userObj || session?.user;
        if (activeUser) {
          const { data: myProf } = await supabase.from("profiles").select("*").eq("id", activeUser.id).single();
          if (myProf) setUserProfile(myProf);
          else setUserProfile({ id: activeUser.id, email: activeUser.email, full_name: activeUser.email, role: "client" });
        }
        const [orgs, stores, kws, ranks, revs, posts, perfs, profs, assigns, audits] = await Promise.all([
          supabase.from("organizations").select("*").order("created_at", { ascending: false }),
          supabase.from("stores").select("*").order("created_at", { ascending: false }),
          supabase.from("keywords").select("*").order("created_at", { ascending: false }),
          supabase.from("rank_measurements").select("*").order("measured_date", { ascending: false }),
          supabase.from("review_snapshots").select("*").order("snapshot_date", { ascending: false }),
          supabase.from("post_records").select("*").order("posted_at", { ascending: false }),
          supabase.from("performance_snapshots").select("*").order("created_at", { ascending: true }),
          supabase.from("profiles").select("*").order("created_at", { ascending: false }),
          supabase.from("store_assignments").select("*"),
          supabase.from("audit_logs").select("*").order("created_at", { ascending: false }).limit(20)
        ]);
        const oList = orgs.data || [];
        const sList = stores.data || [];
        const kList = kws.data || [];
        setDbOrgs(oList); setDbStores(sList); setDbKeywords(kList);
        setDbRanks(ranks.data || []); setDbReviews(revs.data || []); setDbPosts(posts.data || []);
        setDbPerf(perfs.data || []); setDbProfiles(profs.data || []); setDbAssigns(assigns.data || []); setDbAuditLogs(audits.data || []);
        if (oList.length && !newStoreOrgId) setNewStoreOrgId(oList[0].id);
        if (sList.length) {
          if (!targetStoreId) setTargetStoreId(sList[0].id);
          if (!linkStoreId) {
            setLinkStoreId(sList[0].id);
            setLinkGbpLocId(sList[0].gbp_location_id || "");
            setLinkMapAddress(`${sList[0].prefecture || ""}${sList[0].city || ""}${sList[0].address || ""}`);
          }
          if (selectedStoreId === "demo-iroha") setSelectedStoreId(sList[0].id);
        }
        if (kList.length && !selectedKwIdForRank) setSelectedKwIdForRank(kList[0].id);
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthMsg("");
        if (!supabase) { setAuthMsg("先にSupabase接続設定を保存してください。"); return; }
        if (authMode === "login") {
          const { data, error } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
          if (error) setAuthMsg("ログイン失敗: " + error.message);
          else if (data?.session) { setSession(data.session); await refreshDb(data.session.user); notify("✅ ログインしました！"); }
        } else {
          const { data, error } = await supabase.auth.signUp({ email: email.trim(), password });
          if (error) setAuthMsg("登録エラー: " + error.message);
          else if (data?.session) { setSession(data.session); await refreshDb(data.session.user); }
          else { setAuthMsg("登録完了！ログインしてください。"); setAuthMode("login"); }
        }
      };

      const handleForceLogout = async () => {
        try { if (supabase) await supabase.auth.signOut(); } catch (e) {}
        Object.keys(localStorage).forEach(k => { if (k.startsWith("sb-") || k.includes("supabase")) localStorage.removeItem(k); });
        setSession(null); setUserProfile(null); setAuthMode("login");
        setAuthMsg("ログアウトしました。");
      };

      const allStores = useMemo(() => {
        const orgMap = {};

          client_id: gbpClientId.trim(),
          scope: "https://www.googleapis.com/auth/business.manage",
          callback: async (resp) => {
            if (!resp?.access_token) return;
            notify("🔑 Google認証成功！管理下のGBPアカウント・店舗を検索しています...");
            try {
              const accRes = await fetch("https://mybusinessaccountmanagement.googleapis.com/v1/accounts", {
                headers: { Authorization: `Bearer ${resp.access_token}` }
              });
              const accData = await accRes.json();
              if (accData?.accounts?.length > 0) {
                const accName = accData.accounts[0].name;
                const locRes = await fetch(`https://mybusinessbusinessinformation.googleapis.com/v1/${accName}/locations?readMask=name,title,storefrontAddress`, {
                  headers: { Authorization: `Bearer ${resp.access_token}` }
                });

                }
              } else {
                notify("✅ Google OAuth認証完了（APIクォータ承認後に全ロケーションが自動一覧化されます）");
              }

            }

                        <ReportBanner subTitle="Keywords & Action Log" />
                        <div className="px-8 py-6 flex-1 flex flex-col justify-between space-y-5">
                          <div className="flex items-center gap-2.5"><span className="w-1.5 h-6 bg-blue-600 rounded-full"></span><h3 className="text-lg font-black text-slate-900">Section 3: 検索キーワード分析 & 今月の施策ログ</h3></div>
                          <div className="grid grid-cols-2 gap-6 flex-1">
                            <div className="border border-slate-200 rounded-xl p-5 space-y-3">
                              <h4 className="text-base font-black text-blue-900">ユーザー上位検索キーワード</h4>
                              <p className="text-xs text-slate-500 leading-relaxed">ユーザーがどのようなキーワードで検索した際に貴店のプロフィールが表示されたかのデータです。指名検索と非指名検索のバランスを把握できます。</p>
                              <table className="w-full text-xs border-collapse mt-3">
                                <thead><tr className="bg-slate-100 text-slate-600 border-b border-slate-200"><th className="p-3 text-left">検索タイプ</th><th className="p-3 text-left">キーワード</th><th className="p-3 text-left">ユーザー層の傾向</th></tr></thead>
                                <tbody className="divide-y divide-slate-200">
                                  {mData.searchKeywords.map((kw, i) => (
                                    <tr key={i}><td className="p-3 align-top"><span className={`inline-block text-[10px] font-bold px-2 py-1 rounded ${kw.badgeColor}`}>{kw.type}</span></td><td className="p-3 font-black text-slate-900 align-top whitespace-nowrap">{kw.word}</td><td className="p-3 text-slate-600 leading-relaxed">{kw.desc}</td></tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                            <div className="border border-slate-200 rounded-xl p-5 space-y-3">
                              <h4 className="text-base font-black text-blue-900">今月の運用施策ログ (稼働実績)</h4>
                              <p className="text-xs text-slate-500 leading-relaxed">当月内にMEO運用チーム・および店舗側で実施したGoogleビジネスプロフィールの更新履歴です。</p>
                              <table className="w-full text-xs border-collapse mt-3">
                                <thead><tr className="bg-slate-100 text-slate-600 border-b border-slate-200"><th className="p-3 text-left">施策項目</th><th className="p-3 text-center">実施件数</th><th className="p-3 text-left">備考・ステータス</th></tr></thead>
                                <tbody className="divide-y divide-slate-200">
                                  <tr><td className="p-3.5 font-bold text-slate-800 whitespace-nowrap">最新情報の投稿</td><td className="p-3.5 text-center font-black text-base text-slate-600">{mData.monthlyPostCount}件</td><td className="p-3.5 text-slate-600 leading-relaxed">{mData.monthlyPostCount === 0 ? "今月は発信なし。アクティブな店舗であることをアピールするため更新が推奨されます。" : `当月${mData.monthlyPostCount}件の最新情報を配信済。`}</td></tr>
                                  <tr><td className="p-3.5 font-bold text-slate-800 whitespace-nowrap">写真の追加・更新</td><td className="p-3.5 text-center font-black text-base text-slate-600">{mData.monthlyPhotoAdded}枚</td><td className="p-3.5 text-slate-600 leading-relaxed">{mData.monthlyPhotoAdded === 0 ? "今月は追加なし。視覚的な訴求力向上のため、定期的な追加をご検討ください。" : `当月${mData.monthlyPhotoAdded}枚の写真を追加済。`}</td></tr>
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                        <div className="px-8 py-3 bg-slate-50 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>MEO Performance Report - {currentStore.storeName} 様</span><span>Page 3 of 4</span></div>
                      </div>

                      {/* Page 4 */}
                      <div id="pdf-page-4" style={{ width: "1040px", height: "735px" }} className="bg-white text-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-300 flex flex-col justify-between">
                        <ReportBanner subTitle="Insights & Next Action" />
                        <div className="px-8 py-6 flex-1 flex flex-col justify-between">
                          <div className="flex items-center gap-2.5"><span className="w-1.5 h-6 bg-blue-600 rounded-full"></span><h3 className="text-lg font-black text-slate-900">Section 4: プロの考察 & Next Action</h3></div>
                          <div className="bg-blue-50/40 border-2 border-blue-500 rounded-xl p-5 space-y-3">
                            <h4 className="text-sm font-black text-blue-700 border-b border-blue-200 pb-2">今月の総括・プロの考察</h4>
                            <div className="grid grid-cols-2 gap-6 text-xs leading-relaxed text-slate-700">
                              <div><div className="font-black text-slate-900 mb-1">■ 検索指標の傾向</div><p>{insightSearch}</p></div>
                              <div><div className="font-black text-slate-900 mb-1">■ 口コミの定性分析</div><p>{insightReview}</p></div>
                            </div>
                          </div>
                          <div className="space-y-3">
                            <div><h4 className="text-sm font-black text-slate-900">次月へ向けた戦略提案 (Next Action)</h4><p className="text-xs text-slate-500 mt-0.5">現状の強みである「高い検索露出」と「高評価」を、さらに確実な「予約・来店」へと転換するための3つの施策をご提案します。</p></div>
                            <div className="grid grid-cols-3 gap-5">
                              <div className="border border-slate-200 border-t-4 border-t-amber-500 rounded-xl p-4 space-y-2"><h5 className="text-sm font-black text-slate-900">1. アクティブ感の演出 (投稿・写真追加の再開)</h5><p className="text-xs text-slate-600 leading-relaxed">{nextAct1}</p></div>
                              <div className="border border-slate-200 border-t-4 border-t-amber-500 rounded-xl p-4 space-y-2"><h5 className="text-sm font-black text-slate-900">2. マップから直接のコンバージョン (CV) 導線強化</h5><p className="text-xs text-slate-600 leading-relaxed">{nextAct2}</p></div>
                              <div className="border border-slate-200 border-t-4 border-t-amber-500 rounded-xl p-4 space-y-2"><h5 className="text-sm font-black text-slate-900">3. 高評価口コミへの返信によるファン化</h5><p className="text-xs text-slate-600 leading-relaxed">{nextAct3}</p></div>
                            </div>
                          </div>
                        </div>
                        <div className="px-8 py-3 bg-slate-50 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>MEO Performance Report - {currentStore.storeName} 様</span><span>Page 4 of 4</span></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ⑨ CSVインポート */}
              {activeMenu === "csv" && role !== "client" && (
                <div className="space-y-5">
                  <form onSubmit={handleCsvImport} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">📥 CSVインポート（一括登録＆重複チェック）</h2>
                    <select required value={targetStoreId} onChange={e => setTargetStoreId(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="">-- インポート先店舗を選択 --</option>
                      {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <textarea rows="5" required placeholder={"イロハ, 1\nスナック, 3\n金山 スナック, 2"} value={csvText} onChange={e => setCsvText(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-3 text-white font-mono" />
                    <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">CSVデータを検証してインポート実行</button>
                  </form>
                  {csvResult && <div className="bg-navy-900 border border-emerald-500/40 rounded-2xl p-4 text-xs">✅ 新規登録: <strong>{csvResult.inserted}件</strong> ／ 重複スキップ: <strong>{csvResult.skipped}件</strong></div>}
                </div>
              )}

              {/* ⑩ ユーザー・権限管理（管理者 Admin のみアクセス・変更可能） */}
              {activeMenu === "users" && role === "admin" && (
                <div className="space-y-6">
                  <form onSubmit={handleCreateNewUser} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">👥 新規ユーザーの追加・招待（管理者専用機能）</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <input type="text" required placeholder="お名前（例: 佐藤 花子）*" value={newUserName} onChange={e => setNewUserName(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      <select value={newUserRole} onChange={e => setNewUserRole(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white font-bold">
                        <option value="staff">従業員 (Staff：担当店舗管理)</option>
                        <option value="client">顧客 (Client：自社店舗閲覧のみ)</option>
                        <option value="admin">管理者 (Admin：全社管理)</option>
                      </select>
                      <input type="email" required placeholder="メールアドレス *" value={newUserEmail} onChange={e => setNewUserEmail(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      <input type="password" required minLength={6} placeholder="初期パスワード（6文字以上）*" value={newUserPassword} onChange={e => setNewUserPassword(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <button type="submit" className="bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold px-5 py-3 rounded-xl shadow-lg">✨ 新規ユーザーアカウントを追加する</button>
                  </form>

                  <form onSubmit={handleAssignStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                    <h2 className="text-base font-bold text-white">🔗 ユーザーへの店舗アクセス権割り当て</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <select required value={assignUserId} onChange={e => setAssignUserId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- ユーザーを選択 --</option>
                        {dbProfiles.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.email}) [{p.role}]</option>)}
                      </select>
                      <select required value={assignStoreId} onChange={e => setAssignStoreId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                      <select value={assignRole} onChange={e => setAssignRole(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="client">顧客として閲覧のみ許可</option>
                        <option value="staff">担当スタッフとして編集許可</option>
                      </select>
                    </div>
                    <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">割り当てを保存</button>
                  </form>

                  <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-2 text-xs">
                    <h3 className="text-sm font-bold text-white mb-2">登録ユーザー一覧 ＆ 権限変更（管理者のみ操作可・{dbProfiles.length}名）</h3>
                    {dbProfiles.map(p => (
                      <div key={p.id} className="p-3 rounded-xl bg-navy-800 border border-slate-700 flex flex-wrap justify-between items-center gap-2">
                        <span><strong>{p.full_name}</strong> ({p.email})</span>
                        <select value={p.role} onChange={e => handleChangeUserRole(p.id, e.target.value)} className="bg-navy-900 border border-slate-600 rounded-lg px-2.5 py-1 text-white font-bold">
                          <option value="admin">管理者 (Admin)</option>
                          <option value="staff">従業員 (Staff)</option>
                          <option value="client">顧客 (Client)</option>
                        </select>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ⑪ システム設定・Google OAuth 2.0 GBP連結（管理者 Admin のみ） */}
              {activeMenu === "settings" && role === "admin" && (
                <div className="space-y-5">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                      <h2 className="text-base font-bold text-cyan-300">🔗 Google Business Profile (GBP) OAuth 2.0 連結</h2>
                      <p className="text-slate-400">GoogleアカウントでOAuth認証を行い、管理下のGBPロケーションをシステム内の店舗と直結します。</p>
                      <select value={targetStoreId} onChange={e => setTargetStoreId(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 連結先の店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                      <input type="text" placeholder="Google Cloud OAuth 2.0 Client ID (xxxx.apps.googleusercontent.com)" value={gbpClientId} onChange={e => setGbpClientId(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      <div className="flex flex-col gap-2">
                        <button type="button" onClick={handleGoogleOAuthConnect} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg">
                          🔐 GoogleアカウントでログインしてGBP店舗を連結する
                        </button>
                        <button type="button" onClick={handleAutoCollectGbp} className="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black py-3 rounded-xl shadow-lg">
                          ⚡ GBPデータを自動収集して4枚組レポートに反映
                        </button>
                      </div>
                      {gbpLocationsList.length > 0 && (
                        <div className="p-3 bg-navy-950 rounded-xl border border-emerald-500/40 space-y-1">
                          <div className="font-bold text-emerald-300">検出されたGBP店舗:</div>
                          {gbpLocationsList.map((loc, i) => <div key={i} className="text-slate-300">・{loc.title} ({loc.name})</div>)}
                        </div>
                      )}
                    </div>

                    <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs flex flex-col justify-between">
                      <div>
                        <h2 className="text-base font-bold text-emerald-300 mb-2">🛡️ セキュリティ診断テスト (PostgreSQL RLS検証)</h2>
                        <p className="text-slate-400">権限外の他社店舗IDを直接指定しても遮断されること、およびユーザーによる権限偽装がロックされていることを検証します。</p>
                      </div>
                      <button type="button" onClick={handleRunSecurityTest} className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg">🔍 セキュリティ診断を実行する</button>
                    </div>
                  </div>
                  {secReport && (
                    <div className="bg-navy-900 border border-emerald-500/40 rounded-2xl p-5 space-y-2 text-xs">
                      {secReport.map((r, i) => <div key={i} className="p-3 bg-navy-950 rounded-xl flex justify-between"><span><strong>{r.name}</strong>: {r.desc}</span><span className="text-emerald-400 font-bold">{r.status}</span></div>)}
                    </div>
                  )}
                  <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-2 text-xs">
                    <h3 className="text-sm font-bold text-white mb-2">操作監査ログ一覧（{dbAuditLogs.length}件）</h3>
                    {dbAuditLogs.map(log => <div key={log.id} className="p-2.5 rounded-xl bg-navy-800 border border-slate-700 flex justify-between"><span className="text-cyan-300 font-bold">{log.action} ({log.target_table})</span><span className="text-slate-400">{new Date(log.created_at).toLocaleString("ja-JP")}</span></div>)}
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
