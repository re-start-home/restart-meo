      const handleDownloadPerfect4PagePdf = async () => {
        if (!window.html2canvas || !window.jspdf) {
          window.print();
          return;
        }
        setIsGeneratingPdf(true);
        notify("📄 Page 1 ➔ Page 4 の順番でA4横PDFを精密生成しています（約5秒お待ちください）...");

        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: "a4"
          });

          const pageIds = ["pdf-page-1", "pdf-page-2", "pdf-page-3", "pdf-page-4"];
          const pdfWidth = 297; // A4横幅(mm)
          const pdfHeight = 210; // A4縦幅(mm)

          for (let i = 0; i < pageIds.length; i++) {
            const el = document.getElementById(pageIds[i]);
            if (!el) continue;

            const canvas = await window.html2canvas(el, {
              scale: 2,
              useCORS: true,
              backgroundColor: "#ffffff",
              width: 1040,
              height: 735,
              windowWidth: 1200
            });

            const imgData = canvas.toDataURL("image/jpeg", 0.96);
            if (i > 0) {
              pdf.addPage("a4", "landscape");
            }
            pdf.addImage(imgData, "JPEG", 0, 0, pdfWidth, pdfHeight);

        let inserted = 0;
        let skipped = 0;
        const existingSet = new Set(dbKeywords.filter(k => k.store_id === csvStoreId).map(k => k.keyword.toLowerCase()));

        for (let i = 0; i < lines.length; i++) {
          const raw = lines[i].trim();
          if (!raw) continue;
          const cols = raw.split(",").map(c => c.trim());
          const word = cols[0];
          const rankVal = cols[1] ? Number(cols[1]) : null;
          if (i === 0 && (word.toLowerCase() === "keyword" || word === "キーワード")) continue;
          if (word.length < 2) continue;
          if (existingSet.has(word.toLowerCase())) { skipped++; continue; }

          const { data: kwData, error: kwErr } = await supabase.from("keywords").insert({
            store_id: csvStoreId, keyword: word
          }).select().single();

          if (!kwErr && kwData) {
            existingSet.add(word.toLowerCase());
            inserted++;
            if (rankVal !== null && !isNaN(rankVal) && rankVal > 0) {
              await supabase.from("rank_measurements").insert({
                store_id: csvStoreId, keyword_id: kwData.id, rank_position: rankVal, source_type: "csv"
              });
            }
          }

        setCsvReport({ inserted, skipped });
        setCsvText("");

                      <div>
                        <label className="block text-slate-300 mb-1">対象店舗 *</label>
                        <select required value={targetStoreForKw} onChange={e => setTargetStoreForKw(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                          <option value="">-- 店舗を選択 --</option>
                          {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-300 mb-1">対策キーワード *</label>
                        <input type="text" required placeholder="例: 金山 スナック" value={newKeywordText} onChange={e => setNewKeywordText(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      </div>
                      <button type="submit" className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl">キーワードを登録する</button>
                    </form>

                    <form onSubmit={handleAddRank} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                      <h3 className="text-sm font-bold text-emerald-300">📍 検索順位の記録</h3>
                      <div>
                        <label className="block text-slate-300 mb-1">対象キーワード *</label>
                        <select required value={selectedKwIdForRank} onChange={e => setSelectedKwIdForRank(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                          <option value="">-- キーワードを選択 --</option>
                          {dbKeywords.map(k => <option key={k.id} value={k.id}>{k.keyword}</option>)}
                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-slate-300 mb-1">計測順位（位）*</label>
                          <input type="number" min="1" max="100" required value={newRankPos} onChange={e => setNewRankPos(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                        </div>
                        <div>
                          <label className="block text-slate-300 mb-1">測定日</label>
                          <input type="date" required value={newRankDate} onChange={e => setNewRankDate(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                        </div>
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl">順位を記録する</button>
                    </form>
                  </div>
                </div>
              )}

              {/* ========================================================= */}
              {/* 💬 6. 口コミ管理 (reviews) */}
              {/* ========================================================= */}
              {activeMenu === "reviews" && (
                <form onSubmit={handleSaveReviewAndPerf} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">💬 口コミ・GBPパフォーマンス実績管理</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-slate-300 mb-1">対象店舗</label>
                      <select value={targetStoreForManual} onChange={e => setTargetStoreForManual(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white">
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">対象月表記</label>
                      <input type="text" value={perfMonth} onChange={e => setPerfMonth(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">口コミ総数 (件)</label>
                      <input type="number" value={revTotal} onChange={e => setRevTotal(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">平均評価 (★)</label>
                      <input type="number" step="0.1" value={revAvg} onChange={e => setRevAvg(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">検索経由表示回数</label>
                      <input type="number" value={perfSearch} onChange={e => setPerfSearch(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">マップ経由表示回数</label>
                      <input type="number" value={perfProfile} onChange={e => setPerfProfile(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">WEBアクセス数</label>
                      <input type="number" value={perfWeb} onChange={e => setPerfWeb(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">ルート検索数</label>
                      <input type="number" value={perfRoute} onChange={e => setPerfRoute(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">通話数</label>
                      <input type="number" value={perfCall} onChange={e => setPerfCall(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-lg p-2 text-white" />
                    </div>
                  </div>
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">
                    保存してダッシュボード＆レポートに反映する
                  </button>
                </form>
              )}

              {/* ========================================================= */}
              {/* 📝 7. 投稿管理 (posts) */}
              {/* ========================================================= */}
              {activeMenu === "posts" && (
                <form onSubmit={handleSavePostRecord} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">📝 GBP投稿管理（最新情報・イベント記録）</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select value={targetStoreForManual} onChange={e => setTargetStoreForManual(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <input type="text" required placeholder="投稿タイトル *" value={postTitle} onChange={e => setPostTitle(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                    <input type="text" placeholder="投稿内容メモ" value={postContent} onChange={e => setPostContent(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">投稿実績を記録する</button>
                </form>
              )}

              {/* ========================================================= */}
              {/* 📥 9. CSVインポート (csv) */}
              {/* ========================================================= */}
              {activeMenu === "csv" && (
                <form onSubmit={handleCsvImport} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">📥 CSV一括インポート</h2>
                  <select required value={csvStoreId} onChange={e => setCsvStoreId(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                    <option value="">-- インポート先の店舗を選択 --</option>
                    {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                  <textarea rows="5" required placeholder={"金山 スナック, 2\nイロハ, 1"} value={csvText} onChange={e => setCsvText(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-3 text-white font-mono" />
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl">CSVインポートを実行</button>
                </form>
              )}

              {/* ========================================================= */}
              {/* 👥 10. ユーザー・権限管理 (users) */}
              {/* ========================================================= */}
              {activeMenu === "users" && (
                <form onSubmit={handleAssignStore} className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                  <h2 className="text-base font-bold text-white">👥 ユーザー・権限管理 ＆ 店舗割り当て</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select required value={assignUserId} onChange={e => setAssignUserId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="">-- ユーザーを選択 --</option>
                      {dbProfiles.map(p => <option key={p.id} value={p.id}>{p.full_name} ({p.email})</option>)}
                    </select>
                    <select required value={assignStoreId} onChange={e => setAssignStoreId(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="">-- 店舗を選択 --</option>
                      {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <select value={assignRole} onChange={e => setAssignRole(e.target.value)} className="bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="client">顧客として閲覧許可</option>
                      <option value="staff">担当スタッフとして編集許可</option>
                    </select>
                  </div>
                  <button type="submit" className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl">割り当てを保存</button>
                </form>
              )}

              {/* ========================================================= */}
              {/* ⚙️ 11. システム設定（Google API自動収集・セキュリティ診断・監査ログ） */}
              {/* ========================================================= */}
              {activeMenu === "settings" && (
                <div className="space-y-5">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs">
                      <h3 className="text-sm font-bold text-cyan-300">🔗 Google Business Profile 自動収集・OAuth設定</h3>
                      <select value={selectedApiStoreId} onChange={e => setSelectedApiStoreId(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="">-- 対象店舗を選択 --</option>
                        {dbStores.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                      <input type="text" placeholder="Google OAuth Client ID (任意)" value={gbpClientId} onChange={e => setGbpClientId(e.target.value)} className="w-full bg-navy-800 border border-slate-700 rounded-xl p-2.5 text-white" />
                      <button
                        type="button"
                        onClick={handleAutoCollectGbpToStore}
                        disabled={isSyncingGbp}
                        className="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black py-3 rounded-xl shadow-lg"
                      >
                        ⚡ GBPデータを自動収集して4ページレポートへ反映する
                      </button>
                    </div>

                    <div className="bg-navy-900 border border-slate-800 rounded-2xl p-5 space-y-4 text-xs flex flex-col justify-between">
                      <div>
                        <h3 className="text-sm font-bold text-emerald-300 mb-2">🛡️ セキュリティ診断（RLS他社データ遮断テスト）</h3>
                        <p className="text-slate-400 leading-relaxed">
                          他社の店舗IDを直接指定してもデータが遮断されることと、監査ログ（`audit_logs`）の記録状態を検証します。
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={handleRunSecurityDiagnostics}
                        className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl"
                      >
                        🔍 セキュリティ検証テストを実行する
                      </button>
                    </div>
                  </div>

                  {securityTestResults && (
                    <div className="bg-navy-900 border border-emerald-500/40 rounded-2xl p-5 space-y-2 text-xs">
                      {securityTestResults.map((r, i) => (
                        <div key={i} className="p-3 bg-navy-950 rounded-xl flex justify-between">
                          <span className="font-bold text-white">{r.title}: {r.detail}</span>
                          <span className="text-emerald-400 font-bold">PASS</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <MainApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
