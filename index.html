    function App() {
      // --- Supabase接続設定ステート ---
      const [sbUrl, setSbUrl] = useState(() => localStorage.getItem("restart_sb_url") || DEFAULT_SUPABASE_URL);
      const [sbKey, setSbKey] = useState(() => localStorage.getItem("restart_sb_key") || DEFAULT_SUPABASE_ANON_KEY);
      const [showConfigModal, setShowConfigModal] = useState(false);

      const supabase = useMemo(() => {
        if (!sbUrl || !sbKey) return null;
        try {
          return window.supabase.createClient(sbUrl.trim(), sbKey.trim());
        } catch (e) {
          console.error(e);
          return null;
        }
      }, [sbUrl, sbKey]);

      // --- 認証・ユーザーステート ---
      const [session, setSession] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authMode, setAuthMode] = useState("login"); // login | signup
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [signupRole, setSignupRole] = useState("admin");
      const [authMessage, setAuthMessage] = useState({ type: "", text: "" });
      const [demoBypass, setDemoBypass] = useState(false);

      // --- ダッシュボードステート ---
      const [role, setRole] = useState("admin");
      const [activeMenu, setActiveMenu] = useState("dashboard");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedStoreId, setSelectedStoreId] = useState(DEMO_STORES[0].id);
      const [selectedKwIndex, setSelectedKwIndex] = useState(0);
      const [metricKey, setMetricKey] = useState("search");
      const [showCriteriaModal, setShowCriteriaModal] = useState(false);
      const [storeList, setStoreList] = useState(DEMO_STORES);

      // セッション監視とプロフィール取得
      useEffect(() => {
        if (!supabase) {
          setAuthLoading(false);
          return;
        }
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session?.user) {
            fetchUserProfile(session.user.id, session.user.email);
          } else {
            setAuthLoading(false);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session?.user) {
            fetchUserProfile(session.user.id, session.user.email);
          } else {
            setUserProfile(null);
            setAuthLoading(false);
          }
        });

        return () => subscription.unsubscribe();
      }, [supabase]);

      const fetchUserProfile = async (userId, userEmail) => {
        if (!supabase) return;
        const { data, error } = await supabase
          .from("profiles")
          .select("*")
          .eq("id", userId)
          .single();

        if (data) {
          setUserProfile(data);
          setRole(data.role || "client");
        } else {
          setUserProfile({ id: userId, email: userEmail, full_name: "ログインユーザー", role: "admin" });
        }
        setAuthLoading(false);
      };

      // Supabase接続情報の保存
      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem("restart_sb_url", sbUrl.trim());
        localStorage.setItem("restart_sb_key", sbKey.trim());
        setShowConfigModal(false);
        setAuthMessage({ type: "success", text: "Supabase接続設定を保存しました！ログインまたは新規登録を行ってください。" });
      };

      // ログイン・新規登録処理
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthMessage({ type: "", text: "" });

        if (!supabase) {
          setAuthMessage({ type: "error", text: "先に下の「Supabase接続設定」からProject URLとanon keyを入力してください。" });
          return;
        }

        if (authMode === "login") {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            setAuthMessage({ type: "error", text: "ログイン失敗: " + error.message });
          }
        } else {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName || "Re.Start 管理者",
                role: signupRole
              }
            }
          });
          if (error) {
            setAuthMessage({ type: "error", text: "登録エラー: " + error.message });
          } else if (data?.user && !data?.session) {
            setAuthMessage({
              type: "warn",
              text: "確認メールが送信されました（SupabaseのAuthentication > Providers > Email で Confirm email をOFFにすると即ログインできます）"
            });
          } else {
            setAuthMessage({ type: "success", text: "アカウント登録＆ログインに成功しました！" });
          }
        }
      };

      const handleLogout = async () => {
        if (supabase) await supabase.auth.signOut();
        setDemoBypass(false);
        setSession(null);
        setUserProfile(null);
      };

      const currentStore = useMemo(() => {
        return storeList.find(s => s.id === selectedStoreId) || storeList[0];
      }, [storeList, selectedStoreId]);

      const currentKeyword = currentStore.keywords[selectedKwIndex] || currentStore.keywords[0];

      const visibleMenus = useMemo(() => {
        return MENU_ITEMS.filter(item => item.roles.includes(role));
      }, [role]);

      const toggleTask = (taskId) => {
        if (role === "client") {
          alert("顧客アカウントは閲覧専用です。タスクの完了操作はRe.Start担当者または管理者のみ行えます。");
          return;
        }
        setStoreList(prev => prev.map(store => {
          if (store.id !== currentStore.id) return store;
          return {
            ...store,
            tasks: store.tasks.map(t => t.id === taskId ? { ...t, done: !t.done } : t)
          };
        }));
      };

      const getPinColor = (rank) => {
        if (rank <= 3) return "bg-emerald-500 border-emerald-200 text-slate-950 shadow-emerald-500/50";
        if (rank <= 10) return "bg-cyan-500 border-cyan-200 text-slate-950 shadow-cyan-500/50";
        return "bg-amber-500 border-amber-200 text-slate-950 shadow-amber-500/50";
      };

      const metricLabels = {
        search: { name: "検索表示数", color: "bg-cyan-400" },
        profile: { name: "プロフィール閲覧数", color: "bg-blue-500" },
        web: { name: "Webサイトクリック数", color: "bg-emerald-400" },
        call: { name: "電話クリック数", color: "bg-amber-400" },
        route: { name: "ルート検索数", color: "bg-purple-400" },
      };

      const maxMetricValue = useMemo(() => {
        if (!currentStore.performance.length) return 100;
        return Math.max(...currentStore.performance.map(p => p[metricKey])) * 1.1;
      }, [currentStore, metricKey]);

      // ==========================================
      // 未ログイン時のログイン画面（フェーズ3）
      // ==========================================
      if (!session && !demoBypass) {
        return (
          <div className="min-h-screen bg-navy-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-navy-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
              {/* ロゴヘッダー */}
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500 via-amber-500 to-blue-600 flex items-center justify-center font-black text-xl text-white shadow-lg">
                  R
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white tracking-wide">Re.Start MEO</h1>
                  <p className="text-xs text-slate-400">MEO対策・GBP統合管理クラウド</p>
                </div>
              </div>

              {/* Supabase接続ステータス */}
              <div className="p-3 rounded-xl bg-navy-800 border border-slate-700/80 flex items-center justify-between text-xs">
                <div className="flex items-center gap-2">
                  <span className={`w-2.5 h-2.5 rounded-full ${supabase ? "bg-emerald-400" : "bg-amber-400 animate-pulse"}`}></span>
                  <span className="text-slate-200 font-medium">
                    {supabase ? "Supabase DB 接続準備完了" : "Supabase URL/Key が未設定です"}
                  </span>
                </div>
                <button
                  onClick={() => setShowConfigModal(!showConfigModal)}
                  className="text-cyan-400 underline font-semibold"
                >
                  {showConfigModal ? "閉じる" : "接続設定"}
                </button>
              </div>

              {/* スマホ画面上からURLとKeyを貼り付けられる設定枠 */}
              {(!supabase || showConfigModal) && (
                <form onSubmit={handleSaveConfig} className="p-4 rounded-xl bg-navy-950 border border-cyan-500/40 space-y-3 text-xs">
                  <div className="font-bold text-cyan-300">🔑 Supabase接続キー設定（Obsidianのメモを貼り付け）</div>
                  <div>
                    <label className="block text-slate-400 mb-1">Project URL (https://xxx.supabase.co)</label>
                    <input
                      type="url"
                      required
                      placeholder="https://xxxxxx.supabase.co"
                      value={sbUrl}
                      onChange={(e) => setSbUrl(e.target.value)}
                      className="w-full bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">API Key (anon public)</label>
                    <input
                      type="text"
                      required
                      placeholder="eyJhbGciOiJIUzI1NiIsInR..."
                      value={sbKey}
                      onChange={(e) => setSbKey(e.target.value)}
                      className="w-full bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-white"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded-lg"
                  >
                    接続キーを保存する
                  </button>
                </form>
              )}

              {/* ログイン / 新規登録切り替えタブ */}
              <div className="grid grid-cols-2 gap-2 bg-navy-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                <button
                  type="button"
                  onClick={() => { setAuthMode("login"); setAuthMessage({ type: "", text: "" }); }}
                  className={`py-2 rounded-lg transition ${authMode === "login" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                >
                  ログイン
                </button>
                <button
                  type="button"
                  onClick={() => { setAuthMode("signup"); setAuthMessage({ type: "", text: "" }); }}
                  className={`py-2 rounded-lg transition ${authMode === "signup" ? "bg-emerald-600 text-white" : "text-slate-400"}`}
                >
                  初期アカウント作成
                </button>
              </div>

              {authMessage.text && (
                <div className={`p-3 rounded-xl text-xs border ${
                  authMessage.type === "error" ? "bg-rose-500/15 border-rose-500/40 text-rose-300" :
                  authMessage.type === "warn" ? "bg-amber-500/15 border-amber-500/40 text-amber-200" :
                  "bg-emerald-500/15 border-emerald-500/40 text-emerald-300"
                }`}>
                  {authMessage.text}
                </div>
